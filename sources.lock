# Every source the kit builds, pinned: name, version, URL, SHA-256.
# FreeRDP's hash is the one upstream publishes next to its release
# (freerdp-<version>.tar.gz.sha256); a tarball named in signed.lock must
# also carry a valid upstream signature. A git+ URL pins a commit: the
# last column is then the commit id. Bump a line, then rebuild.
#
# name      version  url                                                                                      sha256
# FreeRDP, for every client (Linux, Windows, macOS, web): our release, not an
# upstream one. A ripe commit of our integration-latest, picked on the fork as
# release-<YYYYMMDD>.<N>: FreeRDP master 670e10b29 (2026-10-28) plus three open
# pull requests whose code compiles under Emscripten only, the browser
# clipboard (#13733), the MessageChannel yield (#13864) and the page's monitors
# (#13865), and one for every client: the physical monitor size in
# millimetres, not pixels (#13805). Master has the rest of ours: AV1 (#13731),
# sound (#13732), H.264 through WebCodecs (#13812), #13838, #13839, the Opus
# microphone fix (#13810, which 3.32.2 lacks), and since 2026-10-28 the Web
# Audio microphone (#13811), no connection dialog window (#13860), SDL3
# clipboard events with every field set (#13872) and hotkeys read from the key
# event's own modifiers (#13852)
