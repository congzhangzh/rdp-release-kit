# Tarballs that must carry a valid upstream signature (<url>.asc), and the
# fingerprint of the signing key (keys/ holds the public keys), one per
# line: <name in sources.lock>  <fingerprint>.
# xrdp's and xorgxrdp's release tarballs (signed by Koichiro IWAO, xrdp's
# release maintainer) were the first; the kit now builds xrdp from our
# release on the fork and xorgxrdp from a development commit, both pinned by
# commit id, and their key stays in git's history.
# FFmpeg's release tarballs: "FFmpeg release signing key
# <ffmpeg-devel@ffmpeg.org>", keys/ffmpeg-release.asc (https://ffmpeg.org/ffmpeg-devel.asc)
