# dav1d for x86_64 macOS on an Apple Silicon Mac (build/build-macos-client.sh).
# Apple clang targets x86_64 with -arch; the minimum macOS comes from
# MACOSX_DEPLOYMENT_TARGET, which clang reads from the environment. nasm
# assembles dav1d's x86 code as macho64. Rosetta 2 runs what meson builds
# to test, so no exe_wrapper is needed.
[binaries]
c = ['clang', '-arch', 'x86_64']
cpp = ['clang++', '-arch', 'x86_64']
objc = ['clang', '-arch', 'x86_64']
ar = 'ar'
strip = 'strip'
nasm = 'nasm'
pkg-config = 'pkg-config'

[properties]
needs_exe_wrapper = false

[host_machine]
system = 'darwin'
subsystem = 'macos'
kernel = 'xnu'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
