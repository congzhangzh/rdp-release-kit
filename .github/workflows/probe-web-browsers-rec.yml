# A record, not a kit test: one short video per browser (Chrome, Firefox, Safari) of FreeRDP
# Web in AV1 4:2:0 to the kit's macOS host on a GitHub macOS runner, each ending on the page's
# Info at its "AV1 decoder" row (test/probe-web-browsers-rec.sh). It takes the host and the web
# client of the kit's Latest release (as published, nothing built here) and publishes nothing:
# the videos, their stills and the logs are this run's artifact.
name: probe-web-browsers-rec

on:
  push:
    branches: [probe-web-browsers-rec]

permissions:
  contents: read

jobs:
  # the media behind the sessions, as kit.yml's demo-media job fetches it
  demo-media:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/demo
          key: demo-media-${{ hashFiles('test/demo-assets.sh') }}
      - run: |
          dir=$(test/demo-assets.sh)
          mkdir -p dist/demo-media
          cp "$dir/bunny.webm" dist/demo-media/
          rsync -a --exclude .git "$dir/webgl" dist/demo-media/
          du -sh dist/demo-media
      - uses: actions/upload-artifact@v7
        with:
          name: demo-media
          path: dist/demo-media
          if-no-files-found: error
          retention-days: 1

  record:
    needs: [demo-media]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: demo-media
          path: dl/media
      - name: ffmpeg
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: command -v ffmpeg || brew install --quiet ffmpeg
      # the kit's Latest release (build/publish-prerelease.sh with LATEST=1): the macOS host and
      # the web client it was released with, checked against its SHA256SUMS
      - name: The macOS host, the web client and the macOS client of the kit's Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "kit release $tag"; echo "DEMO_KIT=rdp-release-kit $tag" >> "$GITHUB_ENV"
          mkdir -p dl/host dl/web dl/client out && echo "$tag" > out/RELEASE
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -D dl -p SHA256SUMS \
            -p 'freerdp-host-*-macos-arm64.zip' -p 'freerdp-web-*.zip' -p 'sdl3-freerdp-*-macos-arm64.tar.xz'
          cd dl && grep -E ' ((freerdp-host-.*-macos-arm64|freerdp-web-.*)\.zip|sdl3-freerdp-.*-macos-arm64\.tar\.xz)$' SHA256SUMS |
            shasum -a 256 -c -
          (cd host && ditto -x -k ../freerdp-host-*-macos-arm64.zip .)
          (cd web && ditto -x -k ../freerdp-web-*.zip .)
          (cd client && tar -xf ../sdl3-freerdp-*-macos-arm64.tar.xz)
          xattr -dr com.apple.quarantine . || true
          ls -d host/*/ web/index.html client/*/bin/sdl-freerdp
      - name: FreeRDP Web in Chrome, Firefox and Safari, then the native macOS client, recorded
        run: >
          test/probe-web-browsers-rec.sh "$(ls -d dl/host/freerdp-host-*-macos-arm64)"
          "$PWD/dl/web" "$PWD/dl/media" out "$(ls -d "$PWD"/dl/client/sdl3-freerdp-*-macos-arm64)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-web-browsers-rec
          path: out
          retention-days: 7
