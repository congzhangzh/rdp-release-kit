# Probe (branch probe-camera-mac only; publishes nothing, uploads logs): the Mac camera and the
# Mac signing (freerdp-comp-camera-g1's lane Mac).
#  - build-host: FreeRDP-Shadow.app (HOST=1) from the fork's feature-camera-mac commit, with the
#    camera extension (a CoreMediaIO Camera Extension in Contents/Library/SystemExtensions) and
#    its unit tests (ctest), signed ad hoc as every kit build.
#  - build-client: FreeRDP.app (the SDL3 client as an app, camera channel on), bin/sdl-freerdp a
#    shell shim, signed ad hoc.
#  - unsigned: every check that needs no certificate: the usage strings and the README camera
#    lines byte for byte (expected-strings.txt), the ids, the extension's Info.plist and its Mach
#    service rule, the entitlements of every program, the designated requirement of an ad hoc
#    build (a cdhash: a new program to TCC each time), the shim (output, exit codes, exec).
#  - migration: origin/main's old layout (org.freerdp.shadow) installed, then this one: one
#    listener on 3388, no old plist left; then uninstall: nothing left.
#  - signed: the Developer ID: FAILS (red, naming what is missing) until the secrets exist, by
#    design: no ad hoc fallback. Then: temporary keychain, sign inside out (hardened runtime,
#    timestamp, profiles), the same checks in signed mode, the designated requirement of two
#    different builds identical (the proxy for "an update keeps Screen Recording and
#    Accessibility"), notarytool (must say Accepted), staple, validate, spctl, re-zip. Nothing
#    signed is uploaded; the keychain and the secrets' files are deleted in an always() step.
# Artifacts: logs (7 days) and the two unsigned packages the later jobs use (1 day).
name: probe-camera-mac

on:
  push:
    branches: [probe-camera-mac]

permissions:
  contents: read

env:
  FREERDP_REPO: https://github.com/congzhangzh/FreeRDP.git
  FREERDP_BRANCH: feature-camera-mac
  # the probed commit, fixed (the branch may move on): set to the pushed feature-camera-mac
  # commit before pushing this branch; the build job refuses the zeros
  FREERDP_SHA: "f4b06097e7bfd3becffc8a1efbf63a06a3b6a4e1"
  # the one id prefix: io.github.congzhangzh.freerdp-shadow (+ .agent, .camera) and .freerdp
  KIT_MAC_ID_PREFIX: io.github.congzhangzh
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  build-host:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: FreeRDP for the host - the fork's camera commit
        run: |
          sha=$FREERDP_SHA
          [ "$sha" != 0000000000000000000000000000000000000000 ] ||
              { echo "::error::set FREERDP_SHA to the pushed $FREERDP_BRANCH commit"; exit 1; }
          mkdir -p logs
          git ls-remote "$FREERDP_REPO" "refs/heads/$FREERDP_BRANCH" | tee logs/freerdp-branch-head.txt
          sed -i '' -E "s|^(freerdp_mac_host +[^ ]+ +git\+[^ ]+ +)[0-9a-f]{40}\$|\1$sha|" sources.lock
          grep -E '^freerdp_mac_host ' sources.lock | tee logs/freerdp-host.txt
          grep -q " $sha\$" logs/freerdp-host.txt

      - name: Cache sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/sources
          key: sources-probe-camera-mac-${{ hashFiles('sources.lock') }}
          restore-keys: sources-
      - name: Cache compiled objects
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/ccache/macos
          key: ccache-probe-camera-mac-host-${{ github.sha }}
          restore-keys: |
            ccache-probe-camera-mac-host-
            ccache-macos-host-arm64-
      - name: Build tools
        run: brew install bash meson nasm ccache

      - name: Build FreeRDP-Shadow.app with the camera extension (ctest included)
        env:
          CCACHE_MAXSIZE: 1G
          HOST: "1"
          # a variable, not a secret: the team in the extension's Mach service and app group
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: ./build-macos.sh arm64

      - name: What was built
        if: always()
        run: |
          mkdir -p logs
          cp ~/.cache/rdp-release-kit/macos-arm64/log/*.log logs/ 2> /dev/null || true
          ls -la dist | tee logs/dist.txt || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-camera-mac-build-host-logs
          path: logs
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: probe-camera-mac-host-unsigned
          path: dist/freerdp-host-*.zip
          if-no-files-found: error
          retention-days: 1

  build-client:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Cache sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/sources
          key: sources-${{ hashFiles('sources.lock') }}
      - name: Cache compiled objects
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/ccache/macos
          key: ccache-probe-camera-mac-client-${{ github.sha }}
          restore-keys: |
            ccache-probe-camera-mac-client-
            ccache-macos-arm64-
      - name: Build tools
        run: brew install bash meson nasm ccache
      - name: Build FreeRDP.app (the client, camera on)
        env:
          CCACHE_MAXSIZE: 1G
        run: ./build-macos.sh arm64
      - name: What was built
        if: always()
        run: |
          mkdir -p logs
          cp ~/.cache/rdp-release-kit/macos-arm64/log/*.log logs/ 2> /dev/null || true
          ls -la dist | tee logs/dist.txt || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-camera-mac-build-client-logs
          path: logs
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: probe-camera-mac-client-unsigned
          path: dist/sdl3-freerdp-*-macos-arm64.tar.xz
          if-no-files-found: error
          retention-days: 1

  # everything a certificate is not needed for: when the secrets exist, signing is all that is left
  unsigned:
    needs: [build-host, build-client]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: probe-camera-mac-host-unsigned
          path: dl
      - uses: actions/download-artifact@v8
        with:
          name: probe-camera-mac-client-unsigned
          path: dl
      - name: Unpack
        run: |
          mkdir -p pkg out && cd pkg
          ditto -x -k ../dl/freerdp-host-*.zip . && tar -xf ../dl/sdl3-freerdp-*.tar.xz
          echo "HOSTPKG=$PWD/$(ls -d freerdp-host-*/)" >> "$GITHUB_ENV"
          echo "CLIENTPKG=$PWD/$(ls -d sdl3-freerdp-*/)" >> "$GITHUB_ENV"
          find . -maxdepth 6 -name '*.app' -o -maxdepth 6 -name '*.systemextension' | tee ../out/bundles.txt
      - name: The usage strings and the README camera lines, byte for byte
        run: |
          set -o pipefail
          # every one checked, the step fails if any failed
          {
            rc=0
            for w in "host $HOSTPKG/FreeRDP-Shadow.app" "client $CLIENTPKG/FreeRDP.app" "readme $CLIENTPKG/README.txt"; do
                python3 -I build/macos/check-bundle-strings.py test/probe-camera-mac/expected-strings.txt $w || rc=1
            done
            exit $rc
          } 2>&1 | tee out/strings.txt
      - name: Ids, the extension's Info.plist and Mach service, entitlements (ad hoc)
        if: ${{ !cancelled() }}
        run: python3 -I test/probe-camera-mac/check-bundles.py adhoc "$HOSTPKG" "$CLIENTPKG" 2>&1 | tee out/bundles-adhoc.txt; exit "${PIPESTATUS[0]}"
      - name: codesign --verify --strict --deep (both apps)
        if: ${{ !cancelled() }}
        run: |
          codesign --verify --strict --deep --verbose=2 "$HOSTPKG/FreeRDP-Shadow.app"
          codesign --verify --strict --deep --verbose=2 "$CLIENTPKG/FreeRDP.app"
      - name: The designated requirement of an ad hoc build (why each update asked again)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          ditto "$HOSTPKG" twin-a && ditto "$HOSTPKG" twin-b
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1.0.1" twin-b/FreeRDP-Shadow.app/Contents/Info.plist
          build/macos/sign-mac.sh host twin-a - > out/twin-sign.txt && build/macos/sign-mac.sh host twin-b - >> out/twin-sign.txt
          test/probe-camera-mac/dr-check.sh adhoc twin-a twin-b 2>&1 | tee out/dr-adhoc.txt
      - name: bin/sdl-freerdp, the shim (old command lines)
        if: ${{ !cancelled() }}
        run: test/probe-camera-mac/check-shim.sh "$CLIENTPKG" out/shim 2>&1 | tee out/shim.txt; exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-camera-mac-unsigned-logs
          path: out
          retention-days: 7

  migration:
    needs: build-host
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: main
          path: old-kit
      - uses: actions/download-artifact@v8
        with:
          name: probe-camera-mac-host-unsigned
          path: dl
      - name: Unpack
        run: |
          mkdir -p pkg && cd pkg && ditto -x -k ../dl/freerdp-host-*.zip . && xattr -dr com.apple.quarantine . || true
          echo "HOSTPKG=$PWD/$(ls -d freerdp-host-*/)" >> "$GITHUB_ENV"
      - name: Old layout (origin/main), then this one, then uninstall
        run: test/probe-camera-mac/migration.sh old-kit "$HOSTPKG" out 2>&1 | tee migration.txt; exit "${PIPESTATUS[0]}"
      - name: Logs
        if: always()
        run: |
          mkdir -p out && mv migration.txt out/ 2> /dev/null || true
          sudo cp /var/log/freerdp-shadow/*.log out/ 2> /dev/null || true
          sudo chown -R "$(id -u)" out || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-camera-mac-migration-logs
          path: out
          retention-days: 7

  # Developer ID. The secrets can't gate a job (GitHub: "Secrets cannot be directly referenced
  # in if: conditionals"), and a skipped job is grey and easy to miss: so the job always runs and
  # its first step fails, red, naming each missing secret, until they all exist.
  signed:
    needs: [build-host, build-client]
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TEAM: ${{ vars.MACOS_TEAM_ID }}
    steps:
      - name: Signing secrets (no ad hoc fallback)
        env:
          MACOS_SIGN_P12_BASE64: ${{ secrets.MACOS_SIGN_P12_BASE64 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_PROFILE_HOST_BASE64: ${{ secrets.MACOS_PROFILE_HOST_BASE64 }}
          MACOS_PROFILE_CAMERA_BASE64: ${{ secrets.MACOS_PROFILE_CAMERA_BASE64 }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: |
          missing=""
          for v in MACOS_SIGN_P12_BASE64 MACOS_SIGN_P12_PASSWORD MACOS_NOTARY_KEY_P8_BASE64 \
              MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID MACOS_PROFILE_HOST_BASE64 \
              MACOS_PROFILE_CAMERA_BASE64 MACOS_TEAM_ID; do
              [ -n "${!v:-}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
              echo "::error title=Developer ID signing not possible::missing:$missing (repository secrets; MACOS_TEAM_ID is a repository variable). The unsigned job ran every other check."
              exit 1
          fi
          case $MACOS_TEAM_ID in *[!A-Z0-9]*) echo "::error::MACOS_TEAM_ID is not a team id"; exit 1 ;; esac
          echo "all 7 secrets and MACOS_TEAM_ID are set"

      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: probe-camera-mac-host-unsigned
          path: dl
      - uses: actions/download-artifact@v8
        with:
          name: probe-camera-mac-client-unsigned
          path: dl
      - name: Unpack
        run: |
          mkdir -p pkg out && cd pkg
          ditto -x -k ../dl/freerdp-host-*.zip . && tar -xf ../dl/sdl3-freerdp-*.tar.xz
          echo "HOSTPKG=$PWD/$(ls -d freerdp-host-*/ | sed 's|/$||')" >> "$GITHUB_ENV"
          echo "CLIENTPKG=$PWD/$(ls -d sdl3-freerdp-*/ | sed 's|/$||')" >> "$GITHUB_ENV"

      # the secrets only as files in RUNNER_TEMP (mode 600), never echoed
      - name: Temporary keychain with the Developer ID
        env:
          MACOS_SIGN_P12_BASE64: ${{ secrets.MACOS_SIGN_P12_BASE64 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          MACOS_PROFILE_HOST_BASE64: ${{ secrets.MACOS_PROFILE_HOST_BASE64 }}
          MACOS_PROFILE_CAMERA_BASE64: ${{ secrets.MACOS_PROFILE_CAMERA_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN=$RUNNER_TEMP/probe-signing.keychain-db
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          printf '%s' "$MACOS_SIGN_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          printf '%s' "$MACOS_NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          printf '%s' "$MACOS_PROFILE_HOST_BASE64" | base64 --decode > "$RUNNER_TEMP/host.provisionprofile"
          printf '%s' "$MACOS_PROFILE_CAMERA_BASE64" | base64 --decode > "$RUNNER_TEMP/camera.provisionprofile"
          openssl rand -hex 24 > "$RUNNER_TEMP/keychain-pass"
          kcpass=$(cat "$RUNNER_TEMP/keychain-pass")
          echo "::add-mask::$kcpass"
          security create-keychain -p "$kcpass" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$kcpass" "$KEYCHAIN"
          # the Developer ID intermediate (G2), in case the image lacks it: the identity is only
          # valid with its chain
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" -T /usr/bin/codesign || true
          security import "$RUNNER_TEMP/sign.p12" -k "$KEYCHAIN" -P "$MACOS_SIGN_P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security > /dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$KEYCHAIN" > /dev/null
          # this keychain first in the search list, the user's others after it
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN" | tee out/identities.txt
          line=$(grep -E "\"Developer ID Application: .* \($TEAM\)\"" out/identities.txt | head -1 || true)
          [ -n "$line" ] || { echo "::error::no valid 'Developer ID Application: ... ($TEAM)' identity in the .p12"; exit 1; }
          echo "IDENTITY=$(awk '{print $2}' <<< "$line")" >> "$GITHUB_ENV"

      - name: Sign inside out (hardened runtime, timestamp, profiles)
        run: |
          set -o pipefail
          {
            build/macos/sign-mac.sh host "$HOSTPKG" "$IDENTITY" "$TEAM" \
                "$RUNNER_TEMP/host.provisionprofile" "$RUNNER_TEMP/camera.provisionprofile"
            build/macos/sign-mac.sh client "$CLIENTPKG" "$IDENTITY" "$TEAM"
          } 2>&1 | tee out/sign.txt

      - name: Checks (signed) - ids, Info.plist, Mach service, entitlements, runtime, profiles, strings
        run: |
          set -o pipefail
          python3 -I test/probe-camera-mac/check-bundles.py signed "$HOSTPKG" "$CLIENTPKG" "$TEAM" 2>&1 | tee out/bundles-signed.txt
          {
            rc=0
            for w in "host $HOSTPKG/FreeRDP-Shadow.app" "client $CLIENTPKG/FreeRDP.app" "readme $CLIENTPKG/README.txt"; do
                python3 -I build/macos/check-bundle-strings.py test/probe-camera-mac/expected-strings.txt $w || rc=1
            done
            exit $rc
          } 2>&1 | tee out/strings-signed.txt
          codesign --verify --strict --deep --verbose=2 "$HOSTPKG/FreeRDP-Shadow.app"
          codesign --verify --strict --deep --verbose=2 "$CLIENTPKG/FreeRDP.app"

      - name: Programs still run under the hardened runtime
        run: |
          set -o pipefail
          "$CLIENTPKG/bin/sdl-freerdp" --version | tee out/client-version.txt
          # the main executable with the restricted system-extension entitlement: AMFI kills it at
          # launch unless the embedded profile allows it, so this is the profile's real test
          "$HOSTPKG/FreeRDP-Shadow.app/Contents/MacOS/freerdp-shadow-cli" /version 2>&1 | tee out/host-version.txt
          "$HOSTPKG/FreeRDP-Shadow.app/Contents/MacOS/freerdp-shadow-camera" status 2>&1 | tee out/camera-status.txt || true
          PYTHONPATH="$CLIENTPKG/lib/freerdp-tk" "$CLIENTPKG/python/bin/python3" -s -c \
              'import tkinter, ctypes, keyring, freerdp_tk; print("freerdp-tk modules import under the hardened runtime")' | tee out/python.txt
          test/probe-camera-mac/check-shim.sh "$CLIENTPKG" out/shim-signed 2>&1 | tee out/shim-signed.txt

      # TCC keys a grant to the designated requirement: two different builds signed the same way
      # must have the same one, naming the identity, not the build
      - name: Will an update keep Screen Recording and Accessibility? (designated requirement)
        run: |
          set -o pipefail
          ditto dl twin-dl
          mkdir twins && cd twins && ditto -x -k ../twin-dl/freerdp-host-*.zip a && ditto -x -k ../twin-dl/freerdp-host-*.zip b && cd ..
          A=$(ls -d twins/a/freerdp-host-*); B=$(ls -d twins/b/freerdp-host-*)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1.0.1" "$B/FreeRDP-Shadow.app/Contents/Info.plist"
          for t in "$A" "$B"; do
              build/macos/sign-mac.sh host "$t" "$IDENTITY" "$TEAM" \
                  "$RUNNER_TEMP/host.provisionprofile" "$RUNNER_TEMP/camera.provisionprofile" > /dev/null
          done
          test/probe-camera-mac/dr-check.sh signed "$A" "$B" "$TEAM" 2>&1 | tee out/dr-signed.txt

      - name: Notarize (notarytool, App Store Connect API key), staple, validate, Gatekeeper
        env:
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -uo pipefail
          notarize() {  # notarize <name> <package dir> <app>
              local name=$1 dir=$2 app=$3 id status
              ditto -c -k --keepParent "$dir" "$RUNNER_TEMP/$name.zip"
              xcrun notarytool submit "$RUNNER_TEMP/$name.zip" --key "$RUNNER_TEMP/notary.p8" \
                  --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID" \
                  --wait --timeout 30m --output-format json > "out/notary-$name.json" 2> "out/notary-$name.err"
              id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id",""))' "out/notary-$name.json" 2> /dev/null)
              status=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status",""))' "out/notary-$name.json" 2> /dev/null)
              echo "$name: notarization $id: ${status:-no answer}"
              if [ -n "$id" ]; then
                  xcrun notarytool log "$id" --key "$RUNNER_TEMP/notary.p8" --key-id "$MACOS_NOTARY_KEY_ID" \
                      --issuer "$MACOS_NOTARY_ISSUER_ID" "out/notary-$name-log.json" > /dev/null 2>&1 || true
              fi
              if [ "$status" != Accepted ]; then
                  echo "::error::$name: notarization says '${status:-nothing}', not Accepted"
                  cat "out/notary-$name.err" "out/notary-$name-log.json" 2> /dev/null
                  return 1
              fi
              xcrun stapler staple "$app" && xcrun stapler validate "$app" || return 1
              spctl -a -vv -t exec "$app" 2>&1 | tee "out/spctl-$name.txt"
              grep -q "accepted" "out/spctl-$name.txt" && grep -q "Notarized Developer ID" "out/spctl-$name.txt" || return 1
              # the stapled app zipped again, as a release would ship it (not uploaded)
              rm -f "$RUNNER_TEMP/$name.zip"
              ditto -c -k --keepParent "$dir" "$RUNNER_TEMP/$name-stapled.zip"
              shasum -a 256 "$RUNNER_TEMP/$name-stapled.zip" | tee -a out/stapled-zips.txt
          }
          rc=0
          notarize host "$HOSTPKG" "$HOSTPKG/FreeRDP-Shadow.app" || rc=1
          notarize client "$CLIENTPKG" "$CLIENTPKG/FreeRDP.app" || rc=1
          exit $rc

      - name: Delete the keychain and the secrets' files
        if: always()
        run: |
          [ -z "${KEYCHAIN:-}" ] || security delete-keychain "$KEYCHAIN" 2> /dev/null || true
          rm -f "$RUNNER_TEMP"/{sign.p12,notary.p8,host.provisionprofile,camera.provisionprofile,keychain-pass}
          security list-keychains -d user
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-camera-mac-signed-logs
          path: out
          retention-days: 7
