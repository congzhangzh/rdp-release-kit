# Probe (branch probe-b3b only; publishes nothing, no secrets, uploads logs): B3b on the macOS host.
# The kit's macOS client (./build-macos.sh arm64, the freerdp pin) and FreeRDP-Shadow.app
# (HOST=1 ./build-macos.sh arm64, the freerdp_mac_host pin), both from fork
# feature-client-gfx-default-order (a client that names no codec prefers HEVC 4:2:0, AV1, AV2;
# /gfx: names the codecs in the order preferred; on release-20261128.4), the plists with
# /gfx-hevc:i420; then test/mac-hevc-first.sh: a client with no codec option gets HEVC from the
# plist's server and AV1 from one without HEVC; freerdp-tk's /gfx:HEVC:i420,AV1,AVC420 the same;
# /gfx:HEVC:i420 HEVC alone; /gfx:AV1:i444 AV1 without FRDP_2 offered; /gfx:AV2,AV1 AV2 (RECORD
# lines: caps, frames, failed decodes, server fps and CPU). The job fails on any FAIL line.
name: probe-b3b

on:
  push:
    branches: [probe-b3b]

permissions:
  contents: read

env:
  FREERDP_REPO: https://github.com/congzhangzh/FreeRDP.git
  FREERDP_BRANCH: feature-client-gfx-default-order

jobs:
  mac-client:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Cache sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/sources
          key: sources-${{ hashFiles('sources.lock') }}
      - name: Cache compiled objects
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/ccache/macos
          key: ccache-macos-arm64-b3b-${{ github.sha }}
          restore-keys: ccache-macos-arm64-
      - name: Build tools
        run: brew install bash meson nasm ccache
      - name: Build (as the release)
        env:
          CCACHE_MAXSIZE: 1G
        run: ./build-macos.sh arm64
      - uses: actions/upload-artifact@v7
        with:
          name: probe-client-macos-arm64
          path: dist/*.tar.xz
          if-no-files-found: error
          retention-days: 3

  mac-host:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: FreeRDP for the host, the probed commit
        run: |
          mkdir -p logs
          grep -E '^(freerdp|freerdp_mac_host) ' sources.lock | tee logs/freerdp-host.txt
          git ls-remote "$FREERDP_REPO" "refs/heads/$FREERDP_BRANCH" | tee logs/branch-head.txt
          # both pins (the client's and the host's) are the branch's head: the probe tests what
          # the branch holds
          for p in freerdp freerdp_mac_host; do
              pin=$(awk -v p="$p" '$1 == p { print $NF }' sources.lock)
              grep -q "^$pin" logs/branch-head.txt || { echo "::error::$p $pin is not $FREERDP_BRANCH's head"; exit 1; }
          done
      - name: Cache sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/sources
          key: sources-${{ hashFiles('sources.lock') }}
      - name: Cache compiled objects
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/ccache/macos
          key: ccache-macos-host-arm64-b3b-${{ github.sha }}
          restore-keys: |
            ccache-macos-host-arm64-
            ccache-macos-arm64-
      - name: Build tools
        run: brew install bash meson nasm ccache
      - name: Build (as the release)
        env:
          CCACHE_MAXSIZE: 1G
          HOST: "1"
        run: ./build-macos.sh arm64 2>&1 | tee logs/build.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-host-log-macos-arm64
          path: |
            logs
            ~/.cache/rdp-release-kit/macos-arm64/log
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: probe-host-macos-arm64
          path: dist/freerdp-host-*.zip
          if-no-files-found: error
          retention-days: 3

  hevc-first:
    needs: [mac-client, mac-host]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: probe-host-macos-arm64
          path: dl/host
      - uses: actions/download-artifact@v8
        with:
          name: probe-client-macos-arm64
          path: dl/client
      - name: Unpack
        run: |
          cd dl/host && ditto -x -k freerdp-host-*.zip . && cd ../client && tar -xf sdl3-freerdp-*.tar.xz
          cd .. && xattr -dr com.apple.quarantine . || true
          ls -d host/*/ client/*/
      - name: B3b (test/mac-hevc-first.sh)
        run: |
          # the script's own exit, not tee's
          set -o pipefail
          rc=0
          test/mac-hevc-first.sh "$(ls -d dl/host/freerdp-host-*-macos-arm64)" \
              "$(ls -d dl/client/sdl3-freerdp-*-macos-arm64)" out | tee out-hevc-first.txt || rc=$?
          mkdir -p out && mv out-hevc-first.txt out/
          grep -E '^(PASS|FAIL|RECORD) ' out/out-hevc-first.txt >> "$GITHUB_STEP_SUMMARY" || true
          # any FAIL, no PASS at all, or the script's own failure fails the job
          if grep -q '^FAIL ' out/out-hevc-first.txt || ! grep -q '^PASS ' out/out-hevc-first.txt || [ $rc != 0 ]; then
              echo "::error::B3b failed (rc $rc)"; exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-b3b
          path: out
          retention-days: 7
