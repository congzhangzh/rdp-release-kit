# Probe (branch probe-camera-mac-line only; publishes nothing, no secrets, uploads logs): the
# macOS host says why it has no server camera. FreeRDP-Shadow.app built as the release builds it
# (HOST=1 ./build-macos.sh arm64, WITH_SHADOW_CAMERA_MAC off: ad hoc signed), from release
# 20261128.2 plus fork feature-camera-mac-r2 9c568e15d, picked onto it as fork
# probe-mac-camera-line c1243fda8 (the only change: one line logged by the Mac subsystem at start).
# Checks: the build is green; the app's binaries carry the line; the host, started for a few
# seconds, logs exactly the product owner's line once, at INFO.
name: probe-camera-mac-line

on:
  push:
    branches: [probe-camera-mac-line]

permissions:
  contents: read

env:
  FREERDP_REPO: https://github.com/congzhangzh/FreeRDP.git
  FREERDP_SHA: c1243fda8a7151acaf2dd9e724c2e87fda2ee8f9
  LINE: "camera: macOS needs the signed build for the server camera (a Developer ID system extension); this build has none"

jobs:
  mac-host:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: FreeRDP for the host, the probed commit
        run: |
          mkdir -p logs
          git ls-remote "$FREERDP_REPO" refs/heads/probe-mac-camera-line | tee logs/branch-head.txt
          sed -i '' -E "s|^(freerdp_mac_host +)[^ ]+( +git\+[^ ]+ +)[0-9a-f]{40}\$|\1probe-${FREERDP_SHA:0:9}\2$FREERDP_SHA|" sources.lock
          grep -E '^freerdp_mac_host ' sources.lock | tee logs/freerdp-host.txt
          grep -q -E " $FREERDP_SHA\$" logs/freerdp-host.txt
      - name: Cache sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/sources
          key: sources-${{ hashFiles('sources.lock') }}
      - name: Cache compiled objects
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/ccache/macos
          key: ccache-macos-host-arm64-line-${{ github.sha }}
          restore-keys: |
            ccache-macos-host-arm64-
            ccache-macos-arm64-
      - name: Build tools
        run: brew install bash meson nasm ccache
      - name: Build (as the release)
        env:
          CCACHE_MAXSIZE: 1G
          HOST: "1"
        run: ./build-macos.sh arm64 2>&1 | tee logs/build.txt
      - name: The line, in the app and at start
        run: |
          mkdir -p out host
          ditto -x -k dist/freerdp-host-*.zip host
          xattr -dr com.apple.quarantine host || true
          app=$(ls -d host/freerdp-host-*-macos-arm64/FreeRDP-Shadow.app)
          n=$(find "$app" -type f -perm -u+x -exec strings -a {} \; 2> /dev/null | grep -c -F "this build has none" || true)
          echo "binaries with the line: $n" | tee out/strings.txt
          [ "$n" -ge 1 ]
          export WLOG_LEVEL=INFO WLOG_APPENDER=FILE WLOG_FILEAPPENDER_OUTPUT_FILE_PATH="$PWD/out"
          WLOG_FILEAPPENDER_OUTPUT_FILE_NAME=server.wlog "$app/Contents/MacOS/freerdp-shadow-cli" \
              /bind-address:127.0.0.1 /port:4489 -auth > out/server-stdout.txt 2>&1 &
          pid=$!
          sleep 8
          kill "$pid" 2> /dev/null || true
          sleep 1
          kill -9 "$pid" 2> /dev/null || true
          grep -F 'camera' out/server.wlog | tee out/camera-lines.txt || true
          n=$(grep -c -F -- "[INFO][com.freerdp.server.shadow.mac] - [mac_shadow_subsystem_start]: $LINE" out/server.wlog || true)
          echo "exact line at INFO, from mac_shadow_subsystem_start: $n time(s)" | tee -a out/camera-lines.txt
          [ "$n" = 1 ]
          echo "PASS: the macOS host logs exactly: $LINE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-camera-mac-line
          path: |
            logs
            out
            ~/.cache/rdp-release-kit/macos-arm64/log
          retention-days: 7
