name: kit

# Builds the portable SDL3 FreeRDP client for Linux (x86_64, aarch64; run
# on the supported distributions) and Windows (x86_64, aarch64); builds the
# xrdp packages for every release in distros.list, checks their
# dependencies and logs in to each over RDP with that client; builds the web
# client and logs in from a browser. A v* tag publishes everything as a
# release; a push to main only builds and tests. The web client itself is
# published on freerdp-web's own Pages; this repository's Pages only redirect
# there (with a v* tag, or Run workflow with "publish").
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the Pages redirect to freerdp-web's site
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/sources
          key: sources-${{ hashFiles('sources.lock') }}

      - name: Build
        run: ./build.sh dist

      - name: Smoke test on the supported distributions
        run: test/smoke.sh dist/*.tar.xz

      - uses: actions/upload-artifact@v7
        with:
          name: sdl3-freerdp-${{ matrix.runner }}
          path: dist/*
          if-no-files-found: error

  windows:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/sources
          key: sources-${{ hashFiles('sources.lock') }}

      - name: Build
        run: ./build-windows.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: sdl3-freerdp-windows-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  releases:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          echo "images=$(grep -v -E '^\s*(#|$)' distros.list | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  xrdp:
    needs: [build, releases]
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.releases.outputs.images) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/sources
          key: sources-${{ hashFiles('sources.lock') }}

      - name: The client, for the login test
        uses: actions/download-artifact@v8
        with:
          name: sdl3-freerdp-ubuntu-24.04
          path: dist

      - name: Name the artifact
        id: name
        run: echo "name=xrdp-$(echo '${{ matrix.image }}' | tr ':/' '--')" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./build-xrdp.sh "${{ matrix.image }}"

      - name: Check the dependencies
        run: ./check-deps.sh "${{ matrix.image }}"

      - name: Log in over RDP
        run: test/xrdp-session.sh "${{ matrix.image }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.name }}
          path: |
            dist/xrdp/*/*.deb
            dist/xrdp/*/*.rpm
          if-no-files-found: error

      - name: Keep the login test's logs and screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-${{ steps.name.outputs.name }}
          path: dist/test/
          if-no-files-found: ignore

  # The web client builds at once; only its login test waits for xrdp
  wasm-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/sources
          key: sources-${{ hashFiles('sources.lock') }}

      - name: Build
        run: |
          ./build-wasm.sh
          cp ~/.cache/rdp-release-kit/wasm/src/freerdp_web/rdp-gateway.sh dist/wasm/

      - uses: actions/upload-artifact@v7
        with:
          name: wasm-build
          path: dist/wasm/
          if-no-files-found: error

  wasm:
    needs: [wasm-build, xrdp]
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # the tested page goes to a pre-release, for freerdp-web
    steps:
      - uses: actions/checkout@v7

      # artifacts keep no file modes
      - uses: actions/download-artifact@v8
        with:
          name: wasm-build
          path: dist/wasm
      - run: chmod +x dist/wasm/rdp-gateway.sh

      # the artifact keeps its debian-13/ directory
      - name: The xrdp packages, for the login test's server
        uses: actions/download-artifact@v8
        with:
          name: xrdp-debian-13
          path: dist/xrdp

      # the test driver uses Node's WebSocket (Node 22+); its checks use uvx
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # setup-uv publishes no vN alias any more: pinned by commit
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # The page from a static server without COOP/COEP (as Pages), the
      # gateway from the page's own rdp-gateway.sh, a login to xrdp
      - name: Log in from the browser
        run: test/wasm-session.sh dist/wasm/web dist/wasm/rdp-gateway.sh

      # freerdp-web publishes the page; it builds nothing. The tested client
      # goes to a pre-release here, one per page commit, with the xrdp
      # packages its check of the published site logs in to.
      - name: Hand the tested page to freerdp-web
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          page=$(awk '$1 == "freerdp_web" { print $4 }' sources.lock)
          tag=web-${page:0:12}
          mkdir -p dist/handoff
          cp dist/wasm/freerdp-web-*.zip dist/handoff/freerdp-web-page.zip
          echo "$GITHUB_SHA" > dist/handoff/KIT_COMMIT
          (cd dist/handoff && sha256sum freerdp-web-page.zip > freerdp-web-page.zip.sha256)
          notes="The web client for freerdp-web $page, built and tested (a browser login to xrdp over SSH) by rdp-release-kit $GITHUB_SHA. freerdp-web's workflow publishes it. Not a kit release."
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Web client for freerdp-web ${page:0:12}" --notes "$notes"
          fi
          gh release upload "$tag" --clobber dist/handoff/* dist/xrdp/debian-13/*.deb

      - uses: actions/upload-artifact@v7
        with:
          name: freerdp-web
          path: |
            dist/wasm/*.zip
            dist/wasm/*.zip.sha256
          if-no-files-found: error

      # The web client is published on freerdp-web's own Pages; this site
      # only sends its visitors there (same origin: their hosts come along)
      - name: The redirect to freerdp-web's site
        run: |
          mkdir -p dist/pages
          for f in index.html install.html safety.html keyboard.html; do
            cp test/pages-redirect.html "dist/pages/$f"
          done
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages

      - name: Keep the browser test's logs and screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-wasm
          path: dist/test/
          if-no-files-found: ignore

  # The tested page goes to GitHub Pages only on purpose: from a v* tag, or
  # from a run started by hand with "publish" (the branch or tag it runs on)
  pages:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [wasm]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
    outputs:
      url: ${{ steps.deploy.outputs.page_url }}

  # The published redirect points to freerdp-web's site
  pages-check:
    needs: [pages]
    runs-on: ubuntu-24.04
    steps:
      - name: The redirect is served
        env:
          URL: ${{ needs.pages.outputs.url }}
        run: |
          for i in $(seq 30); do
            curl -fsSL "${URL}index.html" 2> /dev/null | grep -q 'freerdp-web/' && exit 0
            sleep 10
          done
          echo "the redirect did not appear at $URL" >&2; exit 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows, xrdp, wasm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/**/*.tar.xz
            dist/**/*.zip
            dist/**/*.deb
            dist/**/*.rpm

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find dist -type f \( -name '*.tar.xz' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' \))
          (cd dist && sha256sum "${files[@]#dist/}") > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes "See MANIFEST in each client archive." \
              "${files[@]}" SHA256SUMS
