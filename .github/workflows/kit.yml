name: kit

# Builds the portable SDL3 FreeRDP client for Linux (x86_64, aarch64; run
# on the supported distributions) and Windows (x86_64, aarch64); builds the
# xrdp packages (our release of xrdp, with Xorg and Wayland sessions) for
# every release in distros.list, checks their dependencies and logs in to
# each over RDP with that client, Xorg and Wayland; builds the web client
# and logs in from a browser. Every push to main that passes publishes the
# rolling release <YYYYMMDD>.<N> (and the pre-releases of its products); a
# pull request only builds and tests. The web client itself is
# published on freerdp-web's own Pages; this repository has none. A push that
# only moves the freerdp_web pin (a new freerdp-web release; build/changes.sh)
# builds and tests the web client alone: its pre-release, no rolling release.
# Nothing here publishes the site, except a run started by hand with the
# publish_page input, the owner's go for one page tag (docs/RELEASE.md, "The site").
on:
  push:
    branches: [main]
    # a change no build reads makes no new release (docs/RELEASE.md,
    # "Frozen releases")
    paths-ignore: ['**.md', 'docs/**', '.github/workflows/upstream.yml', '.github/workflows/pins.yml', 'check-upstream.sh', 'pins.notes', 'build/pins-table.sh', 'build/release-notes.sh', 'build/xrdp-install-notes.sh', 'build/site.sh', 'build/site-anchors.json', '.github/workflows/site.yml', 'LICENSE', 'NOTICE']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_page:
        description: "The go: a freerdp-web tag, to publish the site from this run's release if every test passes. It must be the pinned page. Empty: no publish"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # The kit's own scripts, without building: local sources, builder images,
  # and the one-time publishing of the pre-releases (a fake gh)
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: test/overrides.sh
      - run: test/publish.sh
      - run: test/changes.sh
      - run: test/site-go.sh
      - name: freerdp-web is pinned by a release (vX.Y.Z)
        run: build/check-release-pins.sh
      - name: The README's pins tables are current
        run: build/pins-table.sh --check README.md

  build:
    needs: [releases]
    if: needs.releases.outputs.scope == 'all'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/sources
          key: sources-${{ hashFiles('sources.lock') }}

      # compiled objects from the last run (a pull request's own cache is
      # never restored on main)
      - name: Cache compiled objects
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/ccache
          # by architecture, not runner name: "ubuntu-24.04-" is a prefix of
          # "ubuntu-24.04-arm-", so x86_64 restored ARM's objects (0 hits)
          key: ccache-linux-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-linux-${{ runner.arch }}-

      - name: Build
        env:
          CCACHE_MAXSIZE: 1G
        run: ./build.sh dist

      # 2 to 3 minutes normally; on the ARM runner it once sat 50 minutes without a line
      # (kit run 41275301734): a hang fails here, and gets a rerun, instead of holding the round
      - name: Smoke test on the supported distributions
        timeout-minutes: 15
        run: test/smoke.sh dist/*.tar.xz

      - uses: actions/upload-artifact@v7
        with:
          name: sdl3-freerdp-${{ matrix.runner }}
          path: dist/*
          if-no-files-found: error
          # only carries files to later jobs and the release; 3 days, not the
          # default 90, so old runs stop filling the Actions storage
          retention-days: 3

  windows:
    needs: [releases]
    if: needs.releases.outputs.scope == 'all'
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/sources
          key: sources-${{ hashFiles('sources.lock') }}

      - name: Cache compiled objects
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/ccache
          key: ccache-windows-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ccache-windows-${{ matrix.arch }}-

      - name: Build
        env:
          CCACHE_MAXSIZE: 1G
        run: ./build-windows.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: sdl3-freerdp-windows-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 3

  # The macOS client, natively on each architecture: arm64 on macos-15,
  # x86_64 on macos-15-intel (GitHub's last Intel image), so the x86_64
  # client and its Python run on Intel, not through Rosetta
  macos:
    needs: [releases]
    if: needs.releases.outputs.scope == 'all'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/sources
          key: sources-${{ hashFiles('sources.lock') }}

      - name: Cache compiled objects
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/ccache/macos
          key: ccache-macos-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ccache-macos-${{ matrix.arch }}-

      # bash 4.4+ for the build (macOS has 3.2), meson and nasm for dav1d
      - name: Build tools
        run: brew install bash meson nasm ccache

      - name: Build
        env:
          CCACHE_MAXSIZE: 1G
        run: ./build-macos.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: sdl3-freerdp-macos-${{ matrix.arch }}
          path: dist/*.tar.xz
          if-no-files-found: error
          retention-days: 3

  # The macOS host: FreeRDP's shadow server as FreeRDP-Shadow.app (build-macos-client.sh
  # with HOST=1, freerdp_mac_host). Built and
  # packaged here; mac-host-test below runs it
  mac-host:
    needs: [releases]
    if: needs.releases.outputs.scope == 'all'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/sources
          key: sources-${{ hashFiles('sources.lock') }}

      - name: Cache compiled objects
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/ccache/macos
          key: ccache-macos-host-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-macos-host-${{ matrix.arch }}-
            ccache-macos-${{ matrix.arch }}-

      - name: Build tools
        run: brew install bash meson nasm ccache

      - name: Build
        env:
          CCACHE_MAXSIZE: 1G
          HOST: "1"
        run: ./build-macos.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mac-host-log-${{ matrix.arch }}
          path: ~/.cache/rdp-release-kit/macos-${{ matrix.arch }}/log
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: freerdp-host-macos-${{ matrix.arch }}
          path: dist/freerdp-host-*.zip
          if-no-files-found: error
          retention-days: 3

  # The macOS host tested like the Windows one: this round's FreeRDP-Shadow.app shares a
  # the media the demos play (Big Buck Bunny, the WebGL Aquarium), for the Mac host's web demo:
  # demo.yml's cache (fetched once on a miss), as windows-host.yml's build job takes it
  demo-media:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/demo
          key: demo-media-${{ hashFiles('test/demo-assets.sh') }}
      - run: |
          dir=$(test/demo-assets.sh)
          mkdir -p dist/demo-media
          cp "$dir/bunny.webm" dist/demo-media/
          rsync -a --exclude .git "$dir/webgl" dist/demo-media/
          du -sh dist/demo-media
      - uses: actions/upload-artifact@v7
        with:
          name: demo-media
          path: dist/demo-media
          if-no-files-found: error
          retention-days: 1

  # GitHub macOS runner's own screen, this round's macOS client connects (test/mac-host.sh:
  # an AV1 and an AV2 session). The runner grants Screen Recording to /bin/bash; the host runs
  # with -auth, since the runner account's password can't be set (kit branch
  # mac-capture-probe, run 41366210580: 348 AV1 frames). New, so it doesn't block a release yet
  mac-host-test:
    needs: [macos, mac-host, wasm-build, demo-media]
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: wasm-build
          path: dl/wasm
      - uses: actions/download-artifact@v8
        with:
          name: demo-media
          path: dl/media
      # the web demo makes its MP4 with ffmpeg (test/wasm-demo.mjs); the image has none
      - name: ffmpeg
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: command -v ffmpeg || brew install --quiet ffmpeg
      - uses: actions/download-artifact@v8
        with:
          name: freerdp-host-macos-arm64
          path: dl/host
      - uses: actions/download-artifact@v8
        with:
          name: sdl3-freerdp-macos-arm64
          path: dl/client
      - name: Unpack
        run: |
          cd dl/host && ditto -x -k freerdp-host-*.zip . && cd ../client && tar -xf sdl3-freerdp-*.tar.xz
          cd .. && xattr -dr com.apple.quarantine . || true
          ls -d host/*/ client/*/
      - name: The macOS host, with the macOS client
        run: >
          test/mac-host.sh "$(ls -d dl/host/freerdp-host-*-macos-arm64)"
          "$(ls -d dl/client/sdl3-freerdp-*-macos-arm64)" out "$PWD/dl/wasm/web" "$PWD/dl/media"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mac-host-test
          path: out
          retention-days: 7

  # The Linux host: FreeRDP's shadow server for GNOME (Mutter, Wayland or X11) and
  # other X11 desktops in one binary (build.sh with HOST=1, freerdp_linux_host),
  # x86_64 and aarch64, each natively on its own runner as the clients are. Tested
  # below; the release carries both
  linux-host:
    needs: [releases]
    if: needs.releases.outputs.scope == 'all'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/sources
          key: sources-${{ hashFiles('sources.lock') }}

      # the client's objects too: the dependencies are compiled the same way
      - name: Cache compiled objects
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/ccache
          key: ccache-linux-host-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-host-${{ runner.arch }}-
            ccache-linux-${{ runner.arch }}-

      - name: Build
        env:
          CCACHE_MAXSIZE: 1G
          HOST: "1"
        run: ./build.sh dist

      # x86_64 keeps its artifact names (the release takes freerdp-host-linux-x86_64)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-host-log${{ runner.arch == 'ARM64' && '-aarch64' || '' }}
          path: ~/.cache/rdp-release-kit/work-*-host/log
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: freerdp-host-linux-${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          path: dist/freerdp-host-*
          if-no-files-found: error
          retention-days: 3

  # The Linux host on two desktops, with this round's Linux client (test/linux-host.sh):
  # gnome, GNOME Shell 50 headless with systemd as PID 1, the server as the package's
  # user unit (Mutter by default, /subsystem, AV1 and AV2 frames, idle CPU, keys, the
  # owner's login only, the sharing stopped in GNOME ends it with 0); xorg, Xfce on
  # Xvfb with /subsystem:x11. Both in a rootful podman container, as the screens job
  # runs its systemd ones (AppArmor off: its profiles attach to the container's
  # programs too). Each architecture on its own runner, with that architecture's
  # client. The release waits for all four
  linux-host-test:
    needs: [build, linux-host]
    strategy:
      fail-fast: false
      matrix:
        desktop: [gnome, xorg]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: freerdp-host-linux-${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          path: dl/host
      - uses: actions/download-artifact@v8
        with:
          name: sdl3-freerdp-${{ matrix.runner }}
          path: dl/client
      - name: Tools
        run: |
          command -v podman > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q podman; }
          printf '#!/bin/sh\nexec sudo podman "$@"\n' | sudo tee /usr/local/bin/podman-root > /dev/null
          sudo chmod 755 /usr/local/bin/podman-root
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo aa-teardown > /dev/null && echo "AppArmor profiles unloaded"
          sudo systemctl restart docker
          podman --version
      - name: The Linux host on ${{ matrix.desktop }}
        env:
          PODMAN: /usr/local/bin/podman-root
          RUN_OPTS: --security-opt apparmor=unconfined
        run: >
          test/linux-host.sh ${{ matrix.desktop }} "$(ls dl/host/freerdp-host-*-linux-*.tar.xz)"
          "$(ls dl/client/sdl3-freerdp-*-linux-*.tar.xz)" out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-host-test-${{ matrix.desktop }}${{ runner.arch == 'ARM64' && '-aarch64' || '' }}
          path: out
          retention-days: 7

  # The distribution lists, and which builds this push needs (build/changes.sh):
  # "web" when it only moves the freerdp_web pin, else "all" (a pull request
  # and a run by hand: always all)
  releases:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.list.outputs.images }}
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the push's base, to compare with
      # a wrong go stops the run here, before an hour of builds
      - name: The go, if this run was given one
        if: github.event_name == 'workflow_dispatch' && inputs.publish_page != ''
        env:
          PAGE: ${{ inputs.publish_page }}
        run: build/site-go.sh "$PAGE"
      - id: scope
        env:
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          scope=$(build/changes.sh "$BEFORE" "$GITHUB_SHA")
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "this push builds: $scope"
      - id: list
        run: |
          # the image, without its marks (no-sway, no-kde ...)
          echo "images=$(grep -v -E '^\s*(#|$)' distros.list | awk '{print $1}' | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  xrdp:
    needs: [build, releases]
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.releases.outputs.images) }}
        # x86_64 and ARM64 packages, each built and logged in to on its own
        # architecture with that architecture's client
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the packages' release, 0kit<N>, counts the kit's commits

      - name: Cache sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/sources
          key: sources-${{ hashFiles('sources.lock') }}

      - name: The client, for the login test
        uses: actions/download-artifact@v8
        with:
          name: sdl3-freerdp-${{ matrix.runner }}
          path: dist

      - name: Name the artifact
        id: name
        # x86_64 keeps its name: the web login test and the demos take xrdp-debian-13
        run: echo "name=xrdp-$(echo '${{ matrix.image }}' | tr ':/' '--')${{ runner.arch == 'ARM64' && '-arm64' || '' }}" >> "$GITHUB_OUTPUT"

      - name: Cache compiled objects
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/ccache
          key: ccache-${{ steps.name.outputs.name }}-${{ github.sha }}
          restore-keys: ccache-${{ steps.name.outputs.name }}-

      - name: Build
        env:
          CCACHE_MAXSIZE: 1G
        run: ./build-xrdp.sh "${{ matrix.image }}"

      - name: Check the dependencies
        run: ./check-deps.sh "${{ matrix.image }}"

      - name: Log in over RDP, Xorg and Wayland
        run: test/xrdp-session.sh "${{ matrix.image }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.name }}
          path: |
            dist/xrdp/*/*.deb
            dist/xrdp/*/*.rpm
          if-no-files-found: error
          retention-days: 3

      - name: Keep the login test's logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-${{ steps.name.outputs.name }}
          path: dist/test/
          if-no-files-found: ignore
          retention-days: 3

  # Every release's packages, once all of them pass, go to the
  # pre-release xrdp-<YYYYMMDD>.<N>-<kit commit> (pushes only; the rolling
  # release carries them too), published once and never replaced
  xrdp-release:
    if: github.event_name != 'pull_request'
    needs: [scripts, xrdp]
    runs-on: ubuntu-24.04
    concurrency: publish-xrdp-${{ github.sha }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: xrdp-*
          path: dist/xrdp
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r version sha < <(awk '$1 == "xrdp" { print $2, $4 }' sources.lock)
          # the key names the inputs (build/prerelease-tag.sh); the title ends with the tag
          key="xrdp $version ${sha:0:12} (kit ${GITHUB_SHA:0:12})"
          tag=$(build/prerelease-tag.sh xrdp "$key")
          title="xrdp packages $tag"
          # release assets are flat, and GitHub turns '~' and '+' in their
          # names into '.': give the files those names first, so SHA256SUMS
          # matches what is downloaded
          mkdir -p upload
          # PipeWire's xrdp module has its own pre-release (below)
          find dist/xrdp -type f \( -name '*.deb' -o -name '*.rpm' \) \
              ! -name 'pipewire-module-xrdp-*' | while read -r f; do
            cp "$f" "upload/$(basename "$f" | tr '~+' '..')"
          done
          (cd upload && sha256sum -- *.deb *.rpm > SHA256SUMS)
          notes=$(build/release-notes.sh "xrdp $version, our release of xrdp (fork release-$version, commit $sha: its development branch with Wayland sessions for GNOME, KDE and sway, AV1 and pacing), and xorgxrdp's development branch, built and tested (an Xorg and a Wayland login) by rdp-release-kit $GITHUB_SHA. Published once, never replaced; the rolling release carries the same packages." xrdp)$'\n\n'"<!-- kit-key: $key -->"
          build/publish-prerelease.sh "$tag" "$title" "$notes" upload/*

  # PipeWire's xrdp module for Fedora (Fedora does not package it): its own
  # pre-release
  # pipewire-module-xrdp-<YYYYMMDD>.<N>-<kit commit>, published only when
  # what it is built from changes. Its title names those inputs and not the
  # kit commit, so prerelease-tag.sh finds the earlier release of the same
  # inputs and publish-prerelease.sh leaves it as it is.
  pipewire-xrdp-release:
    if: github.event_name != 'pull_request'
    needs: [scripts, xrdp]
    runs-on: ubuntu-24.04
    concurrency: publish-pipewire-xrdp-${{ github.sha }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: xrdp-fedora-*
          path: dist/xrdp
      - name: Publish the pre-release, if its inputs changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r version sha < <(awk '$1 == "pipewire_xrdp" { print $2, $4 }' sources.lock)
          fedora=$(awk '/^fedora:/ { sub("fedora:", "", $1); print $1 }' distros.list | sort -n | paste -sd, -)
          # the source, the Fedora releases and architectures, their build
          # dependencies, the packaging
          inputs=$({ grep '^pipewire_xrdp ' sources.lock; echo "$fedora x86_64 aarch64"; cat deps/rpm.txt build/package-rpm.sh; } |
              sha256sum | cut -c1-12)
          key="pipewire-module-xrdp $version (${sha:0:12}) for Fedora $fedora (inputs $inputs)"
          tag=$(build/prerelease-tag.sh pipewire-module-xrdp "$key")
          title="pipewire-module-xrdp for Fedora $fedora $tag"
          mkdir -p upload
          find dist/xrdp -type f -name 'pipewire-module-xrdp-*.rpm' -exec cp {} upload/ \;
          ls upload/*.rpm > /dev/null
          (cd upload && sha256sum -- *.rpm > SHA256SUMS)
          notes=$(build/release-notes.sh "PipeWire's xrdp module (the sink and source that carry an xrdp session's sound and microphone), release v$version of neutrinolabs/pipewire-module-xrdp ($sha), unpatched, built by rdp-release-kit $GITHUB_SHA for Fedora $fedora, which does not package it. Debian 12 (backports), 13 and Ubuntu 24.04 and newer package it themselves (apt install pipewire-module-xrdp). Published once, never replaced; a new one only when its inputs change." xrdp)$'\n\n'"<!-- kit-key: $key -->"
          build/publish-prerelease.sh "$tag" "$title" "$notes" upload/*

  # GNOME's Mutter for Fedora 45 with our fix (build/build-mutter.sh), an
  # opt-in of the rolling release: built only when its inputs change, else
  # the packages of the pre-release that has them
  mutter:
    needs: [scripts]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: The packages, from the pre-release with these inputs, or built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          key=$(build/build-mutter.sh --key)
          tag=$(build/prerelease-tag.sh mutter "$key")
          arch=$(uname -m)
          mkdir -p dist/mutter
          if gh release download "$tag" -D dist/mutter -p "mutter-[0-9]*.$arch.rpm" -p 'mutter-common-*.rpm' -p SHA256SUMS 2> /dev/null &&
              ls dist/mutter/mutter-[0-9]*."$arch".rpm > /dev/null 2>&1; then
            (cd dist/mutter && sha256sum -c --ignore-missing --quiet SHA256SUMS && rm SHA256SUMS)
            echo "the packages of $tag"
          else
            rm -rf dist/mutter
            build/build-mutter.sh dist/mutter
          fi
          ls dist/mutter
      - uses: actions/upload-artifact@v7
        with:
          name: xrdp-mutter-${{ matrix.runner }}
          path: dist/mutter/
          if-no-files-found: error

  mutter-release:
    if: github.event_name != 'pull_request'
    needs: [mutter]
    runs-on: ubuntu-24.04
    concurrency: publish-mutter-${{ github.sha }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: xrdp-mutter-*
          path: upload
          merge-multiple: true
      - name: Publish the pre-release, if its inputs changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          key=$(build/build-mutter.sh --key)
          tag=$(build/prerelease-tag.sh mutter "$key")
          title="Mutter for Fedora 45 $tag"
          (cd upload && sha256sum -- *.rpm > SHA256SUMS)
          notes=$(build/release-notes.sh "GNOME's Mutter for Fedora 45, Fedora's own package with our fix for a Wayland window that lands on the wrong monitor when the monitor layout moves its monitor (GNOME/mutter#5162, merge request !5438), built and checked (installed with Fedora's gnome-shell) by rdp-release-kit $GITHUB_SHA, x86_64 and ARM64. An opt-in: Fedora's next mutter update replaces it, and the fix with it. Published once, never replaced; a new one only when its inputs change." xrdp)$'\n\n'"<!-- kit-key: $key -->"
          build/publish-prerelease.sh "$tag" "$title" "$notes" upload/*

  # The web client builds at once; only its login test waits for xrdp
  wasm-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/sources
          key: sources-${{ hashFiles('sources.lock') }}

      - name: Cache compiled objects
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/ccache
          key: ccache-wasm-${{ github.sha }}
          restore-keys: ccache-wasm-

      - name: Build
        env:
          CCACHE_MAXSIZE: 1G
        run: |
          ./build-wasm.sh
          cp ~/.cache/rdp-release-kit/wasm/src/freerdp_web/rdp-gateway.sh dist/wasm/
          # the page's own All screens tests, for the multi-monitor ladder
          # (the screens job); a page from before them has none
          mkdir -p dist/wasm/tests
          (cd ~/.cache/rdp-release-kit/wasm/src/freerdp_web &&
              cp test-screens*.mjs test-connect.mjs test-keymap.py "$GITHUB_WORKSPACE/dist/wasm/tests/" 2> /dev/null) ||
              echo "the pinned page has no All screens tests"
          ls dist/wasm/tests

      - uses: actions/upload-artifact@v7
        with:
          name: wasm-build
          path: dist/wasm/
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true   # the page's .well-known/

  # With scope "web" no xrdp job runs: the login test takes the xrdp packages
  # of the newest web-* pre-release, which a full run built and tested
  wasm:
    needs: [scripts, releases, wasm-build, xrdp]
    if: >-
      !cancelled() && needs.scripts.result == 'success' && needs.wasm-build.result == 'success' &&
      (needs.xrdp.result == 'success' || (needs.xrdp.result == 'skipped' && needs.releases.outputs.scope == 'web'))
    runs-on: ubuntu-24.04
    concurrency: publish-web-${{ github.sha }}
    permissions:
      contents: write   # the tested page goes to a pre-release, for freerdp-web
    steps:
      - uses: actions/checkout@v7

      # artifacts keep no file modes
      - uses: actions/download-artifact@v8
        with:
          name: wasm-build
          path: dist/wasm
      - run: chmod +x dist/wasm/rdp-gateway.sh

      # the artifact keeps its debian-13/ directory
      - name: The xrdp packages, for the login test's server
        if: needs.releases.outputs.scope == 'all'
        uses: actions/download-artifact@v8
        with:
          name: xrdp-debian-13
          path: dist/xrdp
      - name: The xrdp packages of the newest web pre-release (only the page changed)
        if: needs.releases.outputs.scope == 'web'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list -R "$GITHUB_REPOSITORY" -L 1000 --json tagName,isPrerelease,isDraft,publishedAt \
            -q '[.[] | select(.isPrerelease and (.isDraft | not) and (.tagName | startswith("web-")))] | sort_by(.publishedAt) | last | .tagName')
          [ -n "$tag" ] || { echo "no web-* pre-release to take the xrdp packages from" >&2; exit 1; }
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p '*.deb' -D dist/xrdp/debian-13
          echo "xrdp packages of $tag:"; ls dist/xrdp/debian-13

      # the test driver uses Node's WebSocket (Node 22+); its checks use uvx
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # setup-uv publishes no vN alias any more: pinned by commit
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # The page from a static server without COOP/COEP (as Pages), the
      # gateway from the page's own rdp-gateway.sh, a login to xrdp
      - name: Log in from the browser
        run: test/wasm-session.sh dist/wasm/web dist/wasm/rdp-gateway.sh
      - name: Log in from the browser, with the JSPI build
        run: WASM_ENGINE=jspi test/wasm-session.sh dist/wasm/web dist/wasm/rdp-gateway.sh
      # xrdp told to send AV2 (its release notes' line), decoded by libavm in the page
      - name: Log in from the browser, xrdp sending AV2
        run: XRDP_AV2=1 test/wasm-session.sh dist/wasm/web dist/wasm/rdp-gateway.sh

      # freerdp-web publishes the page; it builds nothing. The tested client
      # goes to a pre-release here, web-<YYYYMMDD>.<N>-<kit commit>, with the
      # xrdp packages its check of the published site logs in to; published
      # once and never replaced (docs/RELEASE.md, "Frozen releases").
      - name: Hand the tested page to freerdp-web
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          page=$(awk '$1 == "freerdp_web" { print $4 }' sources.lock)
          # freerdp-web's kit-release.sh reads the page commit from the key
          key="Web client for freerdp-web ${page:0:12} (kit ${GITHUB_SHA:0:12})"
          tag=$(build/prerelease-tag.sh web "$key")
          title="Web client $tag"
          mkdir -p dist/handoff
          cp dist/wasm/freerdp-web-*.zip dist/handoff/freerdp-web-page.zip
          echo "$GITHUB_SHA" > dist/handoff/KIT_COMMIT
          # GitHub turns '~' in asset names into '.': name them so first
          for f in dist/xrdp/debian-13/*.deb; do
            cp "$f" "dist/handoff/$(basename "$f" | tr '~+' '..')"
          done
          (cd dist/handoff && sha256sum freerdp-web-page.zip > freerdp-web-page.zip.sha256 &&
            sha256sum -- * > ../SHA256SUMS && mv ../SHA256SUMS .)
          notes=$(build/release-notes.sh "The web client for freerdp-web $page, built and tested (a browser login to xrdp over SSH) by rdp-release-kit $GITHUB_SHA. freerdp-web's workflow publishes it. Not a kit release. Published once, never replaced." web)$'\n\n'"<!-- kit-key: $key -->"
          build/publish-prerelease.sh "$tag" "$title" "$notes" dist/handoff/*

      - uses: actions/upload-artifact@v7
        with:
          name: freerdp-web
          path: |
            dist/wasm/*.zip
            dist/wasm/*.zip.sha256
          if-no-files-found: error
          retention-days: 3

      - name: Keep the browser test's logs and screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-wasm
          path: dist/test/
          if-no-files-found: ignore
          retention-days: 3

  # The multi-monitor ladder (test/screens.sh), one server per runner: rung
  # 1, the one-monitor login, then on the same kind of server the rung above
  # it, the pinned page's All screens test: rung 2 with Xorg, against xrdp's
  # upstream release (Debian 13's own packages) and the kit's xrdp; rung 3,
  # GNOME and KDE on Wayland through the kit's xrdp. A failure says at once whether it is basic (rung 1) or one of
  # several monitors. Nothing waits for it: a red rung shows in the run, the
  # products are published all the same
  screens:
    needs: [releases, wasm-build, xrdp]
    if: "!cancelled() && needs.wasm-build.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        server: [xrdp-original-xorg, xrdp-xorg, xrdp-gnome, xrdp-kde]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: wasm-build
          path: dist/wasm
      - run: chmod +x dist/wasm/rdp-gateway.sh

      # this run's packages; with scope "web" (no xrdp job ran) those of the
      # newest pre-releases, which a full run built and tested. The original
      # xrdp is Debian's own (test/screens.sh)
      - name: The xrdp packages of this run (xrdp-debian-13)
        if: needs.releases.outputs.scope == 'all'
        uses: actions/download-artifact@v8
        with:
          name: xrdp-debian-13
          path: dist/in/xrdp-debian-13
      - name: The xrdp packages of this run (xrdp-fedora-45)
        if: needs.releases.outputs.scope == 'all'
        uses: actions/download-artifact@v8
        with:
          name: xrdp-fedora-45
          path: dist/in/xrdp-fedora-45
      - name: The xrdp packages
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPE: ${{ needs.releases.outputs.scope }}
        run: |
          mkdir -p dist/xrdp/debian-13 dist/xrdp/fedora-45
          if [ "$SCOPE" = all ]; then
              cp dist/in/xrdp-debian-13/debian-13/* dist/xrdp/debian-13/
              cp dist/in/xrdp-fedora-45/fedora-45/* dist/xrdp/fedora-45/
          else
              # the newest xrdp-<date>.<N>-* (xrdp-preview-* before them); the limit is well
              # above the repo's releases: a kind published only when its inputs change, as
              # pipewire-module-xrdp is, can sit far down the list
              newest() {
                  gh release list -R "$GITHUB_REPOSITORY" -L 1000 --json tagName,isPrerelease,isDraft,publishedAt \
                      -q "[.[] | select(.isPrerelease and (.isDraft | not) and (.tagName | startswith(\"$1-\")))] | sort_by(.publishedAt) | last | .tagName"
              }
              # an empty tag would make gh take the Latest release, not fail
              get() {
                  [ -n "$1" ] || { echo "no pre-release for $2 $3" >&2; exit 1; }
                  gh release download "$1" -R "$GITHUB_REPOSITORY" -D "$2" -p "$3"; echo "$3 of $1"
              }
              get "$(newest xrdp)" dist/xrdp/debian-13 '*debian-13_amd64.deb'
              get "$(newest xrdp)" dist/xrdp/fedora-45 '*fc45.x86_64.rpm'
              get "$(newest pipewire-module-xrdp)" dist/xrdp/fedora-45 '*fc45.x86_64.rpm'
          fi
          ls dist/xrdp/*

      # the test drivers use Node's WebSocket (Node 22+); the checks use uvx
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # KDE's xrdp is compiled in its image from these
      - name: Cache sources
        if: matrix.server == 'xrdp-kde'
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/sources
          key: sources-${{ hashFiles('sources.lock') }}

      # GNOME and KDE run systemd in a rootful podman container, as the
      # demos do (demo.yml says why each line is needed)
      - name: Tools
        if: matrix.server == 'xrdp-gnome' || matrix.server == 'xrdp-kde'
        run: |
          printf '#!/bin/sh\nexec sudo podman "$@"\n' | sudo tee /usr/local/bin/podman-root > /dev/null
          sudo chmod 755 /usr/local/bin/podman-root
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo aa-teardown > /dev/null && echo "AppArmor profiles unloaded"
          sudo systemctl restart docker
          podman --version
          ls -l /dev/udmabuf || true

      - name: The ladder
        env:
          PODMAN: ${{ (matrix.server == 'xrdp-gnome' || matrix.server == 'xrdp-kde') && '/usr/local/bin/podman-root' || '' }}
          SERVER_RUN_OPTS: ${{ (matrix.server == 'xrdp-gnome' || matrix.server == 'xrdp-kde') && '--security-opt apparmor=unconfined' || '' }}
        run: test/screens.sh dist/wasm/web dist/wasm/rdp-gateway.sh dist/wasm/tests "${{ matrix.server }}"

      - name: Keep the ladder's logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-screens-${{ matrix.server }}
          path: dist/test/screens/
          if-no-files-found: ignore
          retention-days: 3

  # The demo videos of this commit's web client and xrdp
  # (.github/workflows/demo.yml), published as the pre-release demo-* for
  # freerdp-web's splash and carried by the release below
  # a push to main, or a run started by hand from main (a release a push alone does not make:
  # a push that only moves the freerdp_web pin builds the web client, not a release)
  demo:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # build: the Linux client freerdp-tk's release video unpacks
    needs: [build, wasm, xrdp-release, pipewire-xrdp-release]
    permissions:
      contents: write
    uses: ./.github/workflows/demo.yml
    with:
      kit_sha: ${{ github.sha }}

  # The Windows host (FreeRDP's shadow server and freerdp-shadow-service),
  # built and tested on a Windows runner with this run's Windows client and
  # web client (windows-host.yml)
  windows-host:
    needs: [releases, windows, wasm-build]
    if: needs.releases.outputs.scope == 'all'
    uses: ./.github/workflows/windows-host.yml
    with:
      from_run: true

  # The kit's rolling release <YYYYMMDD>.<N>: every push to main whose
  # products all pass publishes FreeRDP's clients (with their connection
  # window), the xrdp packages and the web client, once and never replaced,
  # as GitHub's latest release, so releases/latest always leads to a tested
  # download (docs/RELEASE.md, "Products and channels")
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build, windows, macos, mac-host, mac-host-test, linux-host, linux-host-test, xrdp, mutter, wasm, demo, windows-host]
    runs-on: ubuntu-24.04
    # one at a time across commits: each counts N from the releases before it,
    # so two pushes close together get .1 and .2, not both .1 (the second
    # would find its name taken and publish nothing)
    concurrency: publish-release
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: write   # to start the site workflow, on the go (it also reads the artifacts)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: sdl3-freerdp-*
          path: dist
          merge-multiple: true
      # the xrdp packages and PipeWire's xrdp module (Fedora)
      - uses: actions/download-artifact@v8
        with:
          pattern: xrdp-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: wasm-build
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: freerdp-host-windows-x86_64
          path: dist
      # the macOS host, both architectures
      - uses: actions/download-artifact@v8
        with:
          pattern: freerdp-host-macos-*
          path: dist
          merge-multiple: true
      # the videos, each from its job's newest attempt: after `gh run rerun --failed` a name
      # has one artifact per attempt, and download-artifact by name took the first one
      # (20261103.11 lost the rerun's KDE video); build/newest-artifact.sh takes the newest.
      # The web client on the Windows host, recorded by windows-host.yml, joins demo.json as
      # "windows", which the page's Get a server shows; the macOS host's demo, recorded by
      # mac-host-test (best effort while that job is new), as "mac"
      - name: The demo videos (newest attempts)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build/newest-artifact.sh windows-host-demo dist/demo
          build/newest-artifact.sh demo-release dist/demo
          build/newest-artifact.sh mac-host-test dist/mac-host-test --optional
      # the Linux host (x86_64 and aarch64), each job's newest attempt too: the tarballs
      # and their .sha256 into dist/, where the files step below takes the tarballs
      # (their checksums go into SHA256SUMS, as every asset's)
      - name: The Linux host (newest attempt)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for arch in x86_64 aarch64; do
            build/newest-artifact.sh "freerdp-host-linux-$arch" dist
            (cd dist && sha256sum -c freerdp-host-*-linux-"$arch".tar.xz.sha256)
          done

      - name: The files
        run: |
          # and the intro's last video ("videos"; build/site-anchors.json gives its address)
          jq '{title: "FreeRDP Web on a Windows host, AV1",
               src: "demo/windows-host.mp4", poster: "demo/windows-host.jpg",
               caption: "FreeRDP Web in a browser on a Windows Server 2025 machine of the CI, through websockify, to FreeRDP'"'"'s shadow server run by freerdp-shadow-service as SYSTEM on the console session: Notepad from Win+R, typing, then Firefox there with web video and WebGL; the picture in AV1 (the CI machine has no sound card, so no sound here). Big Buck Bunny © Blender Foundation, CC BY 3.0; WebGL Aquarium © Google, BSD."} as $w
              | {title: "FreeRDP Web to Windows'"'"' own Remote Desktop",
                 src: "demo/windows-rdp.mp4", poster: "demo/windows-rdp.jpg",
                 caption: "FreeRDP Web in a browser to Windows Server 2025'"'"'s own Remote Desktop on a CI machine, through websockify: a session of its own for the user, Notepad from Win+R, then Firefox in the session with web video and WebGL, with sound. Nothing installed on Windows. Big Buck Bunny © Blender Foundation, CC BY 3.0; WebGL Aquarium © Google, BSD."} as $r
              | .windows = [$w, $r]
              | .videos += [$w + {title: "FreeRDP shadow server + Windows Server 2025, AV1"},
                            $r + {title: "Windows Server 2025'"'"'s own Remote Desktop"}]' \
              dist/demo/demo.json > dist/demo/demo.json.new && mv dist/demo/demo.json.new dist/demo/demo.json
          # the macOS host: FreeRDP Web on it, recorded as the Windows host's demo (mac-host-test,
          # test/mac-host.sh), or else the native client's screen recording
          if [ -s dist/mac-host-test/mac-host-web.mp4 ]; then
            cp dist/mac-host-test/mac-host-web.mp4 dist/demo/mac-host.mp4
            cp dist/mac-host-test/mac-host-web.jpg dist/demo/mac-host.jpg
            jq '{title: "FreeRDP Web on a macOS host, AV1",
                 src: "demo/mac-host.mp4", poster: "demo/mac-host.jpg",
                 caption: "FreeRDP Web in a browser on a GitHub macOS runner, through websockify, to the kit'"'"'s macOS host (FreeRDP-Shadow.app, ScreenCaptureKit) sharing that Mac'"'"'s screen: Firefox there with web video and WebGL; the picture in AV1. The browser runs headless, so the Mac'"'"'s screen shows only its own desktop. Big Buck Bunny © Blender Foundation, CC BY 3.0; WebGL Aquarium © Google, BSD."} as $m
                | .mac = [$m] | .videos += [$m + {title: "FreeRDP shadow server + macOS, AV1"}]' dist/demo/demo.json > dist/demo/demo.json.new && mv dist/demo/demo.json.new dist/demo/demo.json
          elif [ -s dist/mac-host-test/mac-host.mov ]; then
            command -v ffmpeg > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null; }
            ffmpeg -loglevel error -y -i dist/mac-host-test/mac-host.mov -c:v libx264 -pix_fmt yuv420p \
                -movflags +faststart -an dist/demo/mac-host.mp4
            ffmpeg -loglevel error -y -ss 8 -i dist/demo/mac-host.mp4 -frames:v 1 dist/demo/mac-host.jpg
            jq '{title: "FreeRDP shadow server + macOS, AV1",
                 src: "demo/mac-host.mp4", poster: "demo/mac-host.jpg",
                 caption: "The kit'"'"'s macOS host (FreeRDP-Shadow.app, ScreenCaptureKit) on a GitHub macOS runner, and the kit'"'"'s macOS client connected to it on the same Mac, so the client shows the screen it is part of; apps open and close; the picture in AV1. The runner has no sound card, so no sound here."} as $m
                | .mac = [$m] | .videos += [$m]' dist/demo/demo.json > dist/demo/demo.json.new && mv dist/demo/demo.json.new dist/demo/demo.json
          fi
          # freerdp-tk on Windows (test/client-demo/windows.ps1), with the other freerdp-tk
          # videos on Get a client, when the run made it
          if [ -s dist/demo/freerdp-tk-windows.mp4 ]; then
            jq '.clients += [{title: "Windows Remote Desktop, freerdp-tk release (Windows)",
                              src: "demo/freerdp-tk-windows.mp4", poster: "demo/freerdp-tk-windows.jpg",
                              caption: "freerdp-tk on Windows (Server 2025, a CI machine): the kit'"'"'s Windows client unpacked from its zip in PowerShell, freerdp-tk started from it, a connection to Windows'"'"' own Remote Desktop on the same PC: Notepad from Win+R, then Firefox in the session with web video and WebGL, its sound through the session; disconnect, freerdp-tk again, the saved connection opened with the password from Windows'"'"' Credential Manager. Big Buck Bunny © Blender Foundation, CC BY 3.0; WebGL Aquarium © Google, BSD."}]' \
                dist/demo/demo.json > dist/demo/demo.json.new && mv dist/demo/demo.json.new dist/demo/demo.json
          fi
          # the titles and captions in the page's other languages (zh, ja, fr), as "i18n" on
          # every entry; an English text with no translation stays English (build/demo-i18n.py)
          build/demo-i18n.py dist/demo/demo.json
          # assets are flat and GitHub turns '~' and '+' into '.': name the
          # files so first, so SHA256SUMS matches what is downloaded
          mkdir -p upload
          find dist -type f \( -name '*.tar.xz' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' \
              -o -path 'dist/demo/*' \) \
              ! -name SHA256SUMS | while read -r f; do
            cp "$f" "upload/$(basename "$f" | tr '~+' '..')"
          done
          (cd upload && sha256sum -- * > ../SHA256SUMS) && mv SHA256SUMS upload/
          ls upload

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: upload/*

      - name: Publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          freerdp=$(awk '$1 == "freerdp" { print $2 }' sources.lock)
          freerdp_commit=$(awk '$1 == "freerdp" { print $4 }' sources.lock)
          host=$(cd upload && ls freerdp-host-*-windows-x86_64.zip)
          linux_host=$(cd upload && ls freerdp-host-*-linux-x86_64.tar.xz)
          linux_host_arm=$(cd upload && ls freerdp-host-*-linux-aarch64.tar.xz)
          xrdp=$(awk '$1 == "xrdp" { print $2 }' sources.lock)
          key="FreeRDP $freerdp clients, xrdp $xrdp packages (kit ${GITHUB_SHA:0:12})"
          tag=$(build/prerelease-tag.sh release "$key")
          title="RDP All in One (browser, clients, server) $tag"
          # a row per distribution: sessions, direct links, the command
          install=$(build/xrdp-install-notes.sh upload "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag")
          # the same as data, with the clients, for the site's "Get a server"
          # and "Get a client" pages (build/site.sh copies it next to the
          # page); not attested
          # like the files above, its checksum joins SHA256SUMS
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          # shellcheck disable=SC2046 # one argument per client archive
          build/xrdp-install-notes.sh --json upload "$base" |
            jq --arg r "$tag" --arg u "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" --arg b "$base" --arg h "$host" \
               --arg ma "$(cd upload && ls freerdp-host-*-macos-arm64.zip)" --arg mx "$(cd upload && ls freerdp-host-*-macos-x86_64.zip)" \
               --arg lx "$linux_host" --arg la "$linux_host_arm" '
              def platform: capture("-(?<os>linux|windows|macos)-(?<arch>[a-z0-9_]+)\\.") |
                ({linux: "Linux", windows: "Windows", macos: "macOS"}[.os]) + " " +
                (if .os == "macos" then {arm64: "Apple Silicon", x86_64: "Intel"}[.arch]
                 else {x86_64: "x86_64", aarch64: "ARM64"}[.arch] end);
              {release: $r, url: $u} + . +
              {clients: [$ARGS.positional[] | {platform: platform, file: ., url: ($b + "/" + .)}]} +
              # the Windows host: share a Windows PC'"'"'s own screen (the page shows it with the servers)
              {windows: {file: $h, url: ($b + "/" + $h),
                command: ("Invoke-WebRequest " + $b + "/" + $h + " -OutFile freerdp-host.zip; Expand-Archive freerdp-host.zip; Set-Location freerdp-host\\freerdp-host-*; .\\freerdp-shadow-service.exe install --allow-sas -- /bind-address:127.0.0.1 /gfx-av1 /gfx-av2 -gfx-avc444"),
                remove: ".\\freerdp-shadow-service.exe uninstall"}} +
              # the macOS host: share a Mac'"'"'s own screen, one entry per architecture (build/macos/host-README.txt)
              {mac: [[$ma, "Apple Silicon"], [$mx, "Intel"]] | map(.[0] as $f | {platform: .[1], file: $f, url: ($b + "/" + $f),
                command: ("curl -LO " + $b + "/" + $f + " && ditto -x -k " + $f + " . && cd " + ($f | rtrimstr(".zip")) + " && cp -R FreeRDP-Shadow.app /Applications/ && xattr -dr com.apple.quarantine /Applications/FreeRDP-Shadow.app && cp org.freerdp.shadow.plist ~/Library/LaunchAgents/ && launchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/org.freerdp.shadow.plist"),
                then: "Then allow FreeRDP Shadow in System Settings > Privacy & Security, under Screen Recording and Accessibility, and run: launchctl kickstart -k gui/$(id -u)/org.freerdp.shadow",
                kickstart: "launchctl kickstart -k gui/$(id -u)/org.freerdp.shadow",
                remove: "launchctl bootout gui/$(id -u)/org.freerdp.shadow; rm ~/Library/LaunchAgents/org.freerdp.shadow.plist; rm -rf /Applications/FreeRDP-Shadow.app"})} +
              # the Linux host: share a Linux desktop'"'"'s own screen (GNOME on Wayland or X11, other X11
              # desktops), a systemd user unit on 127.0.0.1; one entry per architecture, as "mac"
              # (build/linux/host-README.txt, Install and Connect)
              {linux: [[$lx, "x86_64"], [$la, "ARM64"]] | map(.[0] as $f | ($f | rtrimstr(".tar.xz")) as $d | {platform: .[1], file: $f, url: ($b + "/" + $f),
                unit: "freerdp-shadow.service",
                command: ("curl -LO " + $b + "/" + $f + " && tar -xJf " + $f + " && mkdir -p ~/.local/opt ~/.config/systemd/user && rm -rf ~/.local/opt/freerdp-host && mv " + $d + " ~/.local/opt/freerdp-host && cp ~/.local/opt/freerdp-host/freerdp-shadow.service ~/.config/systemd/user/ && systemctl --user daemon-reload && systemctl --user enable --now freerdp-shadow.service"),
                then: "It listens on 127.0.0.1 only: keep it there and reach it over SSH (ssh -L 13389:127.0.0.1:3389 user@server, then a client to 127.0.0.1:13389). The login is the desktop owner'"'"'s own account. A desktop that does not start graphical-session.target (Xfce, MATE) starts it from its autostart: systemctl --user import-environment DISPLAY XAUTHORITY && systemctl --user start freerdp-shadow. After GNOME'"'"'s Stop sharing, or to apply a change, run: systemctl --user restart freerdp-shadow",
                kickstart: "systemctl --user restart freerdp-shadow",
                log: "journalctl --user -u freerdp-shadow",
                remove: "systemctl --user disable --now freerdp-shadow.service; rm ~/.config/systemd/user/freerdp-shadow.service; rm -r ~/.local/opt/freerdp-host"})}' \
              --args $(cd upload && ls sdl3-freerdp-*-linux-*.tar.xz sdl3-freerdp-*-windows-*.zip sdl3-freerdp-*-macos-*.tar.xz) \
            > upload/install.json
          (cd upload && sha256sum install.json >> SHA256SUMS)
          summary="Rolling release $tag of rdp-release-kit, built and tested from $GITHUB_SHA: FreeRDP's SDL3 client for Linux, Windows and macOS, built from our release of FreeRDP master ($freerdp, commit ${freerdp_commit:0:12}, with the fixes upstream has merged since its last release, such as the Opus microphone), each with freerdp-tk (a window to save and open connections) and the Python that runs it, and our xrdp for Debian, Ubuntu and Fedora (Xorg and Wayland sessions: GNOME, KDE, sway), on x86_64 and ARM64. Published once, never replaced.

          ## Download and run

          | Platform | File | Start |
          |---|---|---|
          | Linux x86_64 | \`sdl3-freerdp-$freerdp-linux-x86_64.tar.xz\` | \`tar -xJf sdl3-freerdp-*.tar.xz\`, then \`sdl3-freerdp-*/freerdp-tk\` (or \`bin/sdl-freerdp /v:server /u:user\`) |
          | Linux ARM64 | \`sdl3-freerdp-$freerdp-linux-aarch64.tar.xz\` | the same |
          | Windows x86_64 | \`sdl3-freerdp-$freerdp-windows-x86_64.zip\` | unzip, then double-click \`freerdp-tk.cmd\` (or \`sdl-freerdp.exe /v:server /u:user\`) |
          | Windows ARM64 | \`sdl3-freerdp-$freerdp-windows-aarch64.zip\` | the same |
          | macOS Apple Silicon | \`sdl3-freerdp-$freerdp-macos-arm64.tar.xz\` | unpack, then double-click \`freerdp-tk.command\` (or \`bin/sdl-freerdp /v:server /u:user\`); downloaded with a browser, clear macOS's quarantine first: \`xattr -dr com.apple.quarantine sdl3-freerdp-*\` (not notarized) |
          | macOS Intel | \`sdl3-freerdp-$freerdp-macos-x86_64.tar.xz\` | the same |
          | xrdp server | see Install xrdp below | |
          | macOS host Apple Silicon | \`$(cd upload && ls freerdp-host-*-macos-arm64.zip)\` | share a Mac's own screen (AV2, AV1 and H.264, its sound): unzip, copy \`FreeRDP-Shadow.app\` to /Applications and the LaunchAgent \`org.freerdp.shadow.plist\` to ~/Library/LaunchAgents, \`launchctl bootstrap gui/\$(id -u) ~/Library/LaunchAgents/org.freerdp.shadow.plist\`, then allow Screen & System Audio Recording and Accessibility (README.txt; signed ad hoc, so each update asks again; not tested on CI, which cannot grant those) |
          | macOS host Intel | \`$(cd upload && ls freerdp-host-*-macos-x86_64.zip)\` | the same |
          | Windows host x86_64 | \`$host\` | share a Windows PC's own screen (logon and lock screens included, AV2 and AV1, its sound): unzip, then in an administrator's PowerShell \`.\\freerdp-shadow-service.exe install --allow-sas -- /bind-address:127.0.0.1 /gfx-av1 /gfx-av2 -gfx-avc444\` (AV1 only: leave out \`/gfx-av2\`; README.txt) |
          | Linux host x86_64 | \`$linux_host\` | share a Linux desktop's own screen (GNOME on Wayland or X11 through Mutter, any other X11 desktop; AV2 and AV1, its sound): \`tar -xJf\` it, move the folder to \`~/.local/opt/freerdp-host\`, copy its \`freerdp-shadow.service\` to \`~/.config/systemd/user/\`, then \`systemctl --user daemon-reload && systemctl --user enable --now freerdp-shadow.service\`. It listens on 127.0.0.1 only: keep it there and reach it over SSH (\`ssh -L 13389:127.0.0.1:3389 user@server\`); the login is the desktop owner's own account (README.txt) |
          | Linux host ARM64 | \`$linux_host_arm\` | the same, on an ARM64 Linux (aarch64) |

          The Linux client runs on glibc 2.34 and newer (RHEL 9, Debian 12, Ubuntu 22.04, Fedora 35 and newer) with PulseAudio's or PipeWire's libpulse; nothing else to install. The macOS client runs on macOS 12 and newer. Check a download: \`sha256sum -c --ignore-missing SHA256SUMS\`; its origin: \`gh attestation verify <file> -R $GITHUB_REPOSITORY\`. Each archive's MANIFEST lists what it was built from.

          $install

          The demo videos (\`xrdp-original-*.mp4\` with xrdp's upstream release as Debian 13 ships it, \`xrdp-gnome*.mp4\`, \`xrdp-kde.mp4\` with this release's xrdp, \`grd-gnome.mp4\`, \`demo.json\`) are this build's web client and xrdp, recorded on throwaway servers: everything shown is synthetic. Big Buck Bunny © Blender Foundation, CC BY 3.0; WebGL Aquarium © Google, BSD."
          notes=$(build/release-notes.sh "$summary" linux windows macos web xrdp windows_host mac_host linux_host)$'\n\n'"<!-- kit-key: $key -->"
          LATEST=1 build/publish-prerelease.sh "$tag" "$title" "$notes" upload/*
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # only with the go named when this run was started; the site workflow's own
      # gates decide from here (a push, or a run without the input, never gets here)
      - name: The site, on the go this run was given
        if: github.event_name == 'workflow_dispatch' && inputs.publish_page != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE: ${{ inputs.publish_page }}
          RELEASE: ${{ steps.publish.outputs.tag }}
        run: |
          build/site-go.sh "$PAGE"
          [ -n "$RELEASE" ] || { echo "no release tag from Publish" >&2; exit 1; }
          gh workflow run site.yml -R "$GITHUB_REPOSITORY" --ref main -f release="$RELEASE" -f publish=true
          echo "### The site: started from release $RELEASE, page $PAGE" >> "$GITHUB_STEP_SUMMARY"
      # the release page keeps the kit's releases and the newest 3 per-round pre-releases of
      # each kind; the rest go, their unique files archived first (build/prune-prereleases.sh).
      # Never fails the release: a hiccup here only leaves a few more for the next round
      - name: Prune old pre-releases
        continue-on-error: true
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: build/prune-prereleases.sh 3
