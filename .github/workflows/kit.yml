name: kit

# Builds the portable SDL3 FreeRDP client for Linux (x86_64, aarch64; run
# on the supported distributions) and Windows (x86_64, aarch64); builds the xrdp packages for every
# release in distros.list, checks their dependencies and logs in to each
# over RDP with that client; publishes all of it on a v* tag.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/sources
          key: sources-${{ hashFiles('sources.lock') }}

      - name: Build
        run: ./build.sh dist

      - name: Smoke test on the supported distributions
        run: test/smoke.sh dist/*.tar.xz

      - uses: actions/upload-artifact@v7
        with:
          name: sdl3-freerdp-${{ matrix.runner }}
          path: dist/*
          if-no-files-found: error

  windows:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/sources
          key: sources-${{ hashFiles('sources.lock') }}

      - name: Build
        run: ./build-windows.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: sdl3-freerdp-windows-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  releases:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          echo "images=$(grep -v -E '^\s*(#|$)' distros.list | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  xrdp:
    needs: [build, releases]
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.releases.outputs.images) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/sources
          key: sources-${{ hashFiles('sources.lock') }}

      - name: The client, for the login test
        uses: actions/download-artifact@v8
        with:
          name: sdl3-freerdp-ubuntu-24.04
          path: dist

      - name: Name the artifact
        id: name
        run: echo "name=xrdp-$(echo '${{ matrix.image }}' | tr ':/' '--')" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./build-xrdp.sh "${{ matrix.image }}"

      - name: Check the dependencies
        run: ./check-deps.sh "${{ matrix.image }}"

      - name: Log in over RDP
        run: test/xrdp-session.sh "${{ matrix.image }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.name }}
          path: |
            dist/xrdp/*/*.deb
            dist/xrdp/*/*.rpm
          if-no-files-found: error

      - name: Keep the login test's logs and screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-${{ steps.name.outputs.name }}
          path: dist/test/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows, xrdp]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/**/*.tar.xz
            dist/**/*.zip
            dist/**/*.deb
            dist/**/*.rpm

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find dist -type f \( -name '*.tar.xz' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' \))
          (cd dist && sha256sum "${files[@]#dist/}") > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes "See MANIFEST in each client archive." \
              "${files[@]}" SHA256SUMS
