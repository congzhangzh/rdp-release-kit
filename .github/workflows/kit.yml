name: kit

# Builds the portable SDL3 FreeRDP client for Linux (x86_64, aarch64; run
# on the supported distributions) and Windows (x86_64, aarch64); builds the
# xrdp packages for every release in distros.list, checks their
# dependencies and logs in to each over RDP with that client; builds the web
# client and logs in from a browser. A v* tag publishes everything as a
# release; a push to main only builds and tests. The web client itself is
# published on freerdp-web's own Pages; this repository has none.
on:
  push:
    branches: [main]
    tags: ['v*']
    # a change no build reads makes no new pre-release (docs/RELEASE.md,
    # "Frozen releases"); tag pushes are never filtered by path
    paths-ignore: ['**.md', 'docs/**', '.github/workflows/upstream.yml', '.github/workflows/pins.yml', 'check-upstream.sh', 'pins.notes', 'build/pins-table.sh', 'build/release-notes.sh', 'LICENSE', 'NOTICE']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The kit's own scripts, without building: local sources, builder images,
  # and the one-time publishing of the pre-releases (a fake gh)
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: test/overrides.sh
      - run: test/publish.sh
      - name: freerdp-web is pinned by a release (vX.Y.Z)
        run: build/check-release-pins.sh
      - name: The README's pins tables are current
        run: build/pins-table.sh --check README.md

  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/sources
          key: sources-${{ hashFiles('sources.lock') }}

      # compiled objects from the last run (a pull request's own cache is
      # never restored on main); a v* release builds without them
      - name: Cache compiled objects
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/ccache
          # by architecture, not runner name: "ubuntu-24.04-" is a prefix of
          # "ubuntu-24.04-arm-", so x86_64 restored ARM's objects (0 hits)
          key: ccache-linux-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-linux-${{ runner.arch }}-

      - name: Build
        env:
          CCACHE: ${{ startsWith(github.ref, 'refs/tags/v') && 'off' || '' }}
          CCACHE_MAXSIZE: 1G
        run: ./build.sh dist

      - name: Smoke test on the supported distributions
        run: test/smoke.sh dist/*.tar.xz

      - uses: actions/upload-artifact@v7
        with:
          name: sdl3-freerdp-${{ matrix.runner }}
          path: dist/*
          if-no-files-found: error

  windows:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/sources
          key: sources-${{ hashFiles('sources.lock') }}

      - name: Cache compiled objects
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/ccache
          key: ccache-windows-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ccache-windows-${{ matrix.arch }}-

      - name: Build
        env:
          CCACHE: ${{ startsWith(github.ref, 'refs/tags/v') && 'off' || '' }}
          CCACHE_MAXSIZE: 1G
        run: ./build-windows.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: sdl3-freerdp-windows-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  releases:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.list.outputs.images }}
      preview: ${{ steps.list.outputs.preview }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          echo "images=$(grep -v -E '^\s*(#|$)' distros.list | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
          echo "preview=$(grep -v -E '^\s*(#|$)' distros-preview.list | awk '{print $1}' | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  xrdp:
    needs: [build, releases]
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.releases.outputs.images) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the packages' release, 0kit<N>, counts the kit's commits

      - name: Cache sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/sources
          key: sources-${{ hashFiles('sources.lock') }}

      - name: The client, for the login test
        uses: actions/download-artifact@v8
        with:
          name: sdl3-freerdp-ubuntu-24.04
          path: dist

      - name: Name the artifact
        id: name
        run: echo "name=xrdp-$(echo '${{ matrix.image }}' | tr ':/' '--')" >> "$GITHUB_OUTPUT"

      - name: Cache compiled objects
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/ccache
          key: ccache-${{ steps.name.outputs.name }}-${{ github.sha }}
          restore-keys: ccache-${{ steps.name.outputs.name }}-

      - name: Build
        env:
          CCACHE: ${{ startsWith(github.ref, 'refs/tags/v') && 'off' || '' }}
          CCACHE_MAXSIZE: 1G
        run: ./build-xrdp.sh "${{ matrix.image }}"

      - name: Check the dependencies
        run: ./check-deps.sh "${{ matrix.image }}"

      - name: Log in over RDP
        run: test/xrdp-session.sh "${{ matrix.image }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.name }}
          path: |
            dist/xrdp/*/*.deb
            dist/xrdp/*/*.rpm
          if-no-files-found: error

      - name: Keep the login test's logs and screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-${{ steps.name.outputs.name }}
          path: dist/test/
          if-no-files-found: ignore

  # The xrdp preview (xrdp_preview in sources.lock): the same build and
  # Xorg login as the release, then a Wayland (sway) login
  xrdp-preview:
    needs: [build, releases]
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.releases.outputs.preview) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the packages' release, 0kit<N>, counts the kit's commits

      - name: Cache sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/sources
          key: sources-${{ hashFiles('sources.lock') }}

      - name: The client, for the login test
        uses: actions/download-artifact@v8
        with:
          name: sdl3-freerdp-ubuntu-24.04
          path: dist

      - name: Name the artifact
        id: name
        run: echo "name=xrdp-preview-$(echo '${{ matrix.image }}' | tr ':/' '--')" >> "$GITHUB_OUTPUT"

      - name: Cache compiled objects
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/ccache
          key: ccache-${{ steps.name.outputs.name }}-${{ github.sha }}
          restore-keys: ccache-${{ steps.name.outputs.name }}-

      - name: Build
        env:
          CCACHE: ${{ startsWith(github.ref, 'refs/tags/v') && 'off' || '' }}
          CCACHE_MAXSIZE: 1G
        run: ./build-xrdp.sh --preview "${{ matrix.image }}"

      - name: Log in over RDP, Xorg and Wayland
        run: test/xrdp-session.sh --preview "${{ matrix.image }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.name }}
          path: |
            dist/xrdp-preview/*/*.deb
            dist/xrdp-preview/*/*.rpm
          if-no-files-found: error

      - name: Keep the login test's logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-${{ steps.name.outputs.name }}
          path: dist/test/
          if-no-files-found: ignore

  # Every release's preview packages, once all of them pass, go to the
  # pre-release xrdp-preview-<YYYYMMDD>.<N>-<kit commit> (pushes only; never
  # a kit release), published once and never replaced
  xrdp-preview-release:
    if: github.event_name != 'pull_request'
    needs: [scripts, xrdp-preview]
    runs-on: ubuntu-24.04
    concurrency: publish-xrdp-preview-${{ github.sha }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: xrdp-preview-*
          path: dist/xrdp-preview
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(awk '$1 == "xrdp_preview" { print $4 }' sources.lock)
          title="xrdp preview ${sha:0:12} (kit ${GITHUB_SHA:0:12})"
          tag=$(build/prerelease-tag.sh xrdp-preview "$title")
          # release assets are flat, and GitHub turns '~' in their names
          # into '.': give the files those names first, so SHA256SUMS
          # matches what is downloaded
          mkdir -p upload
          # PipeWire's xrdp module has its own pre-release (below)
          find dist/xrdp-preview -type f \( -name '*.deb' -o -name '*.rpm' \) \
              ! -name 'pipewire-module-xrdp-*' | while read -r f; do
            cp "$f" "upload/$(basename "$f" | tr '~' '.')"
          done
          (cd upload && sha256sum -- *.deb *.rpm > SHA256SUMS)
          notes=$(build/release-notes.sh "A PREVIEW of the next xrdp: xrdp $sha (its development branch with Wayland sessions, AV1 and pacing) and xorgxrdp's development branch, built and tested (an Xorg and a Wayland login) by rdp-release-kit $GITHUB_SHA. Not an xrdp release. Published once, never replaced." xrdp-preview)
          build/publish-prerelease.sh "$tag" "$title" "$notes" upload/*

  # PipeWire's xrdp module for Fedora (Fedora does not package it), for the
  # stable and the preview xrdp alike: its own pre-release
  # pipewire-module-xrdp-<YYYYMMDD>.<N>-<kit commit>, published only when
  # what it is built from changes. Its title names those inputs and not the
  # kit commit, so prerelease-tag.sh finds the earlier release of the same
  # inputs and publish-prerelease.sh leaves it as it is.
  pipewire-xrdp-release:
    if: github.event_name != 'pull_request'
    needs: [scripts, xrdp-preview]
    runs-on: ubuntu-24.04
    concurrency: publish-pipewire-xrdp-${{ github.sha }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: xrdp-preview-fedora-*
          path: dist/xrdp-preview
      - name: Publish the pre-release, if its inputs changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r version sha < <(awk '$1 == "pipewire_xrdp" { print $2, $4 }' sources.lock)
          fedora=$(awk '/^fedora:/ { sub("fedora:", "", $1); print $1 }' distros-preview.list | sort -n | paste -sd, -)
          # the source, the Fedora releases, their build dependencies, the packaging
          inputs=$({ grep '^pipewire_xrdp ' sources.lock; echo "$fedora"; cat deps/rpm.txt build/package-rpm.sh; } |
              sha256sum | cut -c1-12)
          title="pipewire-module-xrdp $version (${sha:0:12}) for Fedora $fedora (inputs $inputs)"
          tag=$(build/prerelease-tag.sh pipewire-module-xrdp "$title")
          mkdir -p upload
          find dist/xrdp-preview -type f -name 'pipewire-module-xrdp-*.rpm' -exec cp {} upload/ \;
          ls upload/*.rpm > /dev/null
          (cd upload && sha256sum -- *.rpm > SHA256SUMS)
          notes=$(build/release-notes.sh "PipeWire's xrdp module (the sink and source that carry an xrdp session's sound and microphone), release v$version of neutrinolabs/pipewire-module-xrdp ($sha), unpatched, built by rdp-release-kit $GITHUB_SHA for Fedora $fedora, which does not package it. Debian 12 (backports), 13 and Ubuntu 24.04 and newer package it themselves (apt install pipewire-module-xrdp). Published once, never replaced; a new one only when its inputs change." xrdp)
          build/publish-prerelease.sh "$tag" "$title" "$notes" upload/*

  # The web client builds at once; only its login test waits for xrdp
  wasm-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/sources
          key: sources-${{ hashFiles('sources.lock') }}

      - name: Cache compiled objects
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/ccache
          key: ccache-wasm-${{ github.sha }}
          restore-keys: ccache-wasm-

      - name: Build
        env:
          CCACHE: ${{ startsWith(github.ref, 'refs/tags/v') && 'off' || '' }}
          CCACHE_MAXSIZE: 1G
        run: |
          ./build-wasm.sh
          cp ~/.cache/rdp-release-kit/wasm/src/freerdp_web/rdp-gateway.sh dist/wasm/

      - uses: actions/upload-artifact@v7
        with:
          name: wasm-build
          path: dist/wasm/
          if-no-files-found: error
          include-hidden-files: true   # the page's .well-known/

  wasm:
    needs: [scripts, wasm-build, xrdp]
    runs-on: ubuntu-24.04
    concurrency: publish-web-${{ github.sha }}
    permissions:
      contents: write   # the tested page goes to a pre-release, for freerdp-web
    steps:
      - uses: actions/checkout@v7

      # artifacts keep no file modes
      - uses: actions/download-artifact@v8
        with:
          name: wasm-build
          path: dist/wasm
      - run: chmod +x dist/wasm/rdp-gateway.sh

      # the artifact keeps its debian-13/ directory
      - name: The xrdp packages, for the login test's server
        uses: actions/download-artifact@v8
        with:
          name: xrdp-debian-13
          path: dist/xrdp

      # the test driver uses Node's WebSocket (Node 22+); its checks use uvx
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # setup-uv publishes no vN alias any more: pinned by commit
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # The page from a static server without COOP/COEP (as Pages), the
      # gateway from the page's own rdp-gateway.sh, a login to xrdp
      - name: Log in from the browser
        run: test/wasm-session.sh dist/wasm/web dist/wasm/rdp-gateway.sh

      # freerdp-web publishes the page; it builds nothing. The tested client
      # goes to a pre-release here, web-<YYYYMMDD>.<N>-<kit commit>, with the
      # xrdp packages its check of the published site logs in to; published
      # once and never replaced (docs/RELEASE.md, "Frozen releases").
      - name: Hand the tested page to freerdp-web
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          page=$(awk '$1 == "freerdp_web" { print $4 }' sources.lock)
          title="Web client for freerdp-web ${page:0:12} (kit ${GITHUB_SHA:0:12})"
          tag=$(build/prerelease-tag.sh web "$title")
          mkdir -p dist/handoff
          cp dist/wasm/freerdp-web-*.zip dist/handoff/freerdp-web-page.zip
          echo "$GITHUB_SHA" > dist/handoff/KIT_COMMIT
          # GitHub turns '~' in asset names into '.': name them so first
          for f in dist/xrdp/debian-13/*.deb; do
            cp "$f" "dist/handoff/$(basename "$f" | tr '~' '.')"
          done
          (cd dist/handoff && sha256sum freerdp-web-page.zip > freerdp-web-page.zip.sha256 &&
            sha256sum -- * > ../SHA256SUMS && mv ../SHA256SUMS .)
          notes=$(build/release-notes.sh "The web client for freerdp-web $page, built and tested (a browser login to xrdp over SSH) by rdp-release-kit $GITHUB_SHA. freerdp-web's workflow publishes it. Not a kit release. Published once, never replaced." web)
          build/publish-prerelease.sh "$tag" "$title" "$notes" dist/handoff/*

      - uses: actions/upload-artifact@v7
        with:
          name: freerdp-web
          path: |
            dist/wasm/*.zip
            dist/wasm/*.zip.sha256
          if-no-files-found: error

      - name: Keep the browser test's logs and screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-wasm
          path: dist/test/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows, xrdp, wasm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/**/*.tar.xz
            dist/**/*.zip
            dist/**/*.deb
            dist/**/*.rpm

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the xrdp preview has its own pre-release, never a kit release;
          # assets are flat and GitHub turns '~' into '.': name the files
          # so first, so SHA256SUMS matches what is downloaded
          mkdir -p upload
          find dist -type f \( -name '*.tar.xz' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' \) \
              ! -name '*~preview*' | while read -r f; do
            cp "$f" "upload/$(basename "$f" | tr '~' '.')"
          done
          (cd upload && sha256sum -- * > ../SHA256SUMS) && mv SHA256SUMS upload/
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes "$(build/release-notes.sh "rdp-release-kit $GITHUB_REF_NAME. Each client archive's MANIFEST lists what it was built from." linux windows web xrdp)" \
              upload/*
