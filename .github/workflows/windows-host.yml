# The Windows host: FreeRDP's shadow server and freerdp-shadow-service
# (build-windows.sh with HOST=1), for x86_64 and ARM64, each tested on a
# Windows runner of its own architecture (Windows Server 2025, Windows 11 on
# ARM) with the kit's Windows client of that architecture and its web client
# (test/windows-host.ps1). kit.yml calls it with this run's client and web
# client (from_run); pushed alone, on the branch windows-host or a
# windows-host-<topic> branch, it takes them from the kit's latest release and
# publishes nothing.
name: windows-host

on:
  workflow_call:
    inputs:
      from_run:
        type: boolean
        default: false
  push:
    branches: [windows-host, 'windows-host-*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/sources
          key: sources-${{ hashFiles('sources.lock') }}

      - name: Cache compiled objects
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/ccache
          # one cache per architecture; the client's (kit.yml's windows job) holds
          # most of the same objects
          key: ccache-windows-host-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-windows-host-${{ matrix.arch }}-
            ccache-windows-${{ matrix.arch }}-

      - name: Build
        env:
          CCACHE_MAXSIZE: 1G
          HOST: "1"
        run: ./build-windows.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: freerdp-host-windows-${{ matrix.arch }}
          path: dist/freerdp-host-*.zip
          if-no-files-found: error
          retention-days: 3
      # the H.264 test client (not shipped): its own artifact, so the release's
      # freerdp-host-windows-<arch> holds only the host
      - uses: actions/upload-artifact@v7
        with:
          name: h264-test-client-windows-${{ matrix.arch }}
          path: dist/h264-test-client-windows-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 3

      # the media the demo plays (Big Buck Bunny, the WebGL Aquarium), from
      # demo.yml's cache (fetched once on a miss), for both Windows jobs: one
      # artifact, from the x86_64 build
      - name: Cache the media the demo plays
        if: matrix.arch == 'x86_64'
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/demo
          key: demo-media-${{ hashFiles('test/demo-assets.sh') }}
      - name: The demo media
        if: matrix.arch == 'x86_64'
        run: |
          # on a cache miss demo-assets.sh cuts the clip with ffmpeg, which the runner lacks: the
          # CI-only static FFmpeg (build/ci-ffmpeg.sh; never in a release, check-no-ffmpeg.sh)
          build/ci-ffmpeg.sh "$HOME/.cache/ci-ffmpeg" > /dev/null && PATH=$HOME/.cache/ci-ffmpeg/bin:$PATH
          dir=$(test/demo-assets.sh)
          mkdir -p dist/demo-media
          cp "$dir/bunny.webm" dist/demo-media/
          rsync -a --exclude .git "$dir/webgl" dist/demo-media/
          du -sh dist/demo-media
      - if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v7
        with:
          name: windows-host-demo-media
          path: dist/demo-media
          if-no-files-found: error
          retention-days: 1

  # each architecture on its own runner: the ARM64 host and client run natively
  # on Windows 11 on ARM; the x86_64 artifacts keep their names (kit.yml and the
  # demos take them), the ARM64 ones end in -aarch64
  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2025
            suffix: ''
          - arch: aarch64
            runner: windows-11-arm
            suffix: -aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: freerdp-host-windows-${{ matrix.arch }}
          path: dl/host
      - uses: actions/download-artifact@v8
        with:
          name: windows-host-demo-media
          path: dl/media
      - uses: actions/download-artifact@v8
        with:
          name: h264-test-client-windows-${{ matrix.arch }}
          path: dl/h264
      # this run's Windows client and web client, or the latest release's
      - if: inputs.from_run
        uses: actions/download-artifact@v8
        with:
          name: sdl3-freerdp-windows-${{ matrix.arch }}
          path: dl/client
      - if: inputs.from_run
        uses: actions/download-artifact@v8
        with:
          name: wasm-build
          path: dl/wasm
      - if: ${{ !inputs.from_run }}
        name: The latest release's client and web client
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download -R $env:GITHUB_REPOSITORY -D dl/client -p 'sdl3-freerdp-*-windows-${{ matrix.arch }}.zip'
          gh release download -R $env:GITHUB_REPOSITORY -D dl/webzip -p 'freerdp-web-*.zip'
          Expand-Archive (Get-ChildItem dl/webzip/*.zip | Select-Object -First 1).FullName -DestinationPath dl/wasm/web

      - name: Unpack
        shell: pwsh
        run: |
          Expand-Archive (Get-ChildItem dl/host/*.zip | Select-Object -First 1).FullName -DestinationPath host
          Expand-Archive (Get-ChildItem dl/client/*.zip | Select-Object -First 1).FullName -DestinationPath client
          Get-ChildItem host/*/*.exe, client/*/*.exe | ForEach-Object { "$($_.Name)  $($_.Length)" }
          Get-ChildItem dl/wasm/web/index.html

      - name: The Windows host, with the native and the web client
        # 25 to 30 minutes normally; on a slow runner the browser demo on this host records at
        # under 1 fps (AV1 I444 at 1600x900 next to the video it plays), and two runs since
        # 20261101.10 hit 45 (kit runs 41306834042, 41313831132)
        timeout-minutes: 60
        shell: pwsh
        run: >
          ./test/windows-host.ps1 (Get-ChildItem host -Directory | Select-Object -First 1).FullName
          (Get-ChildItem client -Directory | Select-Object -First 1).FullName dl/wasm/web out dl/media
          (Get-ChildItem dl/client/*.zip | Select-Object -First 1).FullName
          (Get-ChildItem dl/h264/*.exe | Select-Object -First 1).FullName

      # A shadow server in the user's own session (not the service) while the screen is
      # locked and unlocked (freerdp-71's lock-resume.ps1): with the DXGI fix it logs one
      # "capture paused", no errors, then "capture resumed" and frames again. A record for
      # now (VERDICT in out/lock-resume/after-summary.txt), never a failure; after the main
      # test, whose end leaves the screen locked
      - name: DXGI across a lock and unlock in the user's session (a record)
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: >
          ./test/lock-resume.ps1 -HostDir (Get-ChildItem host -Directory | Select-Object -First 1).FullName
          -Client "$((Get-ChildItem client -Directory | Select-Object -First 1).FullName)\sdl-freerdp.exe"
          -Out out/lock-resume -Tag after

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-host-test${{ matrix.suffix }}
          path: out
          retention-days: 7
      # the demo video of the web client on the Windows host, for the release
      - uses: actions/upload-artifact@v7
        with:
          name: windows-host-demo${{ matrix.suffix }}
          path: |
            out/windows-host.mp4
            out/windows-host.jpg
            out/windows-rdp.mp4
            out/windows-rdp.jpg
            out/freerdp-tk-windows.mp4
            out/freerdp-tk-windows.jpg
          if-no-files-found: error
          retention-days: 3

  # the Windows client of sources.lock's freerdp, for two-monitors' /multimon step (5b), on a push
  # of this branch alone (kit.yml's own windows job makes the same artifact when it calls this
  # workflow with from_run)
  client:
    if: ${{ !inputs.from_run }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/sources
          key: sources-${{ hashFiles('sources.lock') }}

      - name: Cache compiled objects
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/ccache
          key: ccache-windows-x86_64-${{ github.sha }}
          restore-keys: ccache-windows-x86_64-

      - name: Build
        env:
          CCACHE_MAXSIZE: 1G
        run: ./build-windows.sh x86_64

      - uses: actions/upload-artifact@v7
        with:
          name: sdl3-freerdp-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 3

  # Two monitors (x86_64): the shadow server shares every monitor (test/windows-host-allmon.ps1).
  # The runner has one; an IddCx virtual display driver adds the second during a session:
  # VirtualDrivers/Virtual-Display-Driver (MIT), release 25.7.23, its driver-only zip pinned by
  # SHA256 (probe-iddcx run 45666679353 installed it and captured both outputs on windows-2025).
  # Not on the ARM64 runner: there the monitor appears but DXGI captures it black (same probe run).
  # A runner of its own, beside the main test: a fresh desktop, nothing locked.
  two-monitors:
    needs: [build, client]
    # client is skipped when kit.yml calls this workflow (its windows job made the client)
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.client.result == 'success' || needs.client.result == 'skipped') }}
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      # the driver-only zip of release 25.7.23 (x86), as probe-iddcx pinned it
      VDD_SHA256: e24210692b442b39af763536330ce78b423f19342b7a7792c26de3944e418b3a
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: freerdp-host-windows-x86_64
          path: dl/host
      # this run's client: kit.yml's windows job (from_run) or the client job above
      - uses: actions/download-artifact@v8
        with:
          name: sdl3-freerdp-windows-x86_64
          path: dl/client
      # the driver from the cache when a round had it, keyed by its SHA256 (the test checks the
      # hash again either way): a live GitHub download only on a miss
      - id: vdd
        uses: actions/cache@v6
        with:
          path: dl/vdd/vdd.zip
          key: vdd-25.7.23-x86-${{ env.VDD_SHA256 }}
      - if: steps.vdd.outputs.cache-hit != 'true'
        name: The pinned driver (cache miss)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dl/vdd | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/VirtualDrivers/Virtual-Display-Driver/releases/download/25.7.23/VirtualDisplayDriver-x86.Driver.Only.zip' -OutFile dl/vdd/vdd.zip
          $h = (Get-FileHash -Algorithm SHA256 dl/vdd/vdd.zip).Hash.ToLowerInvariant()
          if ($h -ne $env:VDD_SHA256) { Remove-Item dl/vdd/vdd.zip; throw "the driver zip is $h, not the pinned one" }

      - name: Unpack, the device node tool (MSVC of the image)
        shell: pwsh
        run: |
          Expand-Archive (Get-ChildItem dl/host/*.zip | Select-Object -First 1).FullName -DestinationPath host
          Expand-Archive (Get-ChildItem dl/client/*.zip | Select-Object -First 1).FullName -DestinationPath client
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
          $src = Join-Path $env:GITHUB_WORKSPACE 'test\windows-host-allmon\devnode.c'
          cmd /c "`"$vcvars`" x64 >nul && cd /d tools && cl /nologo /W3 /O2 `"$src`" setupapi.lib newdev.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem host/*/*.exe, client/*/*.exe, tools/*.exe, dl/vdd/vdd.zip | ForEach-Object { "$($_.Name)  $($_.Length)" }

      - name: Two monitors
        timeout-minutes: 25
        shell: pwsh
        run: >
          ./test/windows-host-allmon.ps1 (Get-ChildItem host -Directory | Select-Object -First 1).FullName
          (Get-ChildItem client -Directory | Select-Object -First 1).FullName out dl/vdd/vdd.zip
          $env:VDD_SHA256 tools/devnode.exe

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-host-two-monitors
          path: out
          retention-days: 7

  # Demo 1.1 of the product plan (Boss Cong's go, 2026-11-27): the native Windows client to the
  # shadow server, AV1 4:2:0, web video playing (test/demo-win-native.ps1): the page on the first
  # monitor, the client's window on a second, virtual one (the pinned driver above), the server
  # sharing only the first. windows-native.mp4/.jpg come out only when the session passes the
  # demo's bar (the server's mean at least 15/s and more), and kit.yml's release adds them to
  # demo.json when they are there. A record otherwise: never a failure of the round
  native-demo:
    needs: [build, client]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.client.result == 'success' || needs.client.result == 'skipped') }}
    runs-on: windows-2025
    continue-on-error: true
    timeout-minutes: 30
    env:
      VDD_SHA256: e24210692b442b39af763536330ce78b423f19342b7a7792c26de3944e418b3a
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: freerdp-host-windows-x86_64
          path: dl/host
      - uses: actions/download-artifact@v8
        with:
          name: sdl3-freerdp-windows-x86_64
          path: dl/client
      - uses: actions/download-artifact@v8
        with:
          name: windows-host-demo-media
          path: dl/media
      - id: vdd
        uses: actions/cache@v6
        with:
          path: dl/vdd/vdd.zip
          key: vdd-25.7.23-x86-${{ env.VDD_SHA256 }}
      - if: steps.vdd.outputs.cache-hit != 'true'
        name: The pinned driver (cache miss)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dl/vdd | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/VirtualDrivers/Virtual-Display-Driver/releases/download/25.7.23/VirtualDisplayDriver-x86.Driver.Only.zip' -OutFile dl/vdd/vdd.zip
          $h = (Get-FileHash -Algorithm SHA256 dl/vdd/vdd.zip).Hash.ToLowerInvariant()
          if ($h -ne $env:VDD_SHA256) { Remove-Item dl/vdd/vdd.zip; throw "the driver zip is $h, not the pinned one" }
      - name: Unpack, the device node tool (MSVC of the image)
        shell: pwsh
        run: |
          Expand-Archive (Get-ChildItem dl/host/*.zip | Select-Object -First 1).FullName -DestinationPath host
          Expand-Archive (Get-ChildItem dl/client/*.zip | Select-Object -First 1).FullName -DestinationPath client
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
          $src = Join-Path $env:GITHUB_WORKSPACE 'test\windows-host-allmon\devnode.c'
          cmd /c "`"$vcvars`" x64 >nul && cd /d tools && cl /nologo /W3 /O2 `"$src`" setupapi.lib newdev.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: The native client to the shadow server, recorded
        timeout-minutes: 15
        shell: pwsh
        run: >
          ./test/demo-win-native.ps1 (Get-ChildItem host -Directory | Select-Object -First 1).FullName
          (Get-ChildItem client -Directory | Select-Object -First 1).FullName dl/media out
          dl/vdd/vdd.zip $env:VDD_SHA256 tools/devnode.exe
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-host-native-demo-test
          path: out
          retention-days: 7
      # the demo itself, only when it passed its bar (the release takes it when it is there)
      - uses: actions/upload-artifact@v7
        with:
          name: windows-native-demo
          path: |
            out/windows-native.mp4
            out/windows-native.jpg
            out/windows-native.json
          if-no-files-found: ignore
          retention-days: 3

  # The shadow server's virtual camera as shipped (test/windows-host-camera/windows-host-camera.ps1,
  # from the probe probe-camera-winshadow, 7ff8628): the service registers "FreeRDP Camera" as
  # SYSTEM, an app reads it through Frame Server (the still, not black), and on demand with this
  # run's Windows client, whose camera plays the test video: no Start Streams before an app reads,
  # Start Streams and moving frames while it reads, Stop Streams after. Windows Server 2022 (build
  # 20348) has no virtual cameras: there the check is the server's exact line, and it runs on. Only
  # when kit.yml calls this workflow (its windows job makes the client and the camera's test media)
  camera:
    needs: build
    if: inputs.from_run
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x86_64
          - runner: windows-11-arm
            arch: aarch64
          - runner: windows-2022
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      OUT: ${{ github.workspace }}\camera-out
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: freerdp-host-windows-${{ matrix.arch }}
          path: dl/host
      # the x64 client everywhere (emulated on Windows 11 on ARM), as the probe ran it
      - uses: actions/download-artifact@v8
        with:
          name: sdl3-freerdp-windows-x86_64
          path: dl/zip
      - uses: actions/download-artifact@v8
        with:
          name: camera-test-windows
          path: dl/test
      - name: The camera as the SYSTEM service registers it, read by an app, on demand
        timeout-minutes: 20
        shell: pwsh
        run: |
          Expand-Archive (Get-ChildItem dl/zip/*.zip | Select-Object -First 1).FullName -DestinationPath dl/client
          $zip = (Get-ChildItem dl/host/*.zip | Select-Object -First 1).FullName
          $client = (Get-ChildItem dl/client -Recurse -Filter sdl-freerdp.exe | Select-Object -First 1).FullName
          $media = (Resolve-Path dl/test/test.mp4).Path
          ./test/windows-host-camera/windows-host-camera.ps1 -HostZip $zip -Out $env:OUT `
              -Client $client -ClientCamera "/dvc:rdpecam,sys:mf,file:$media,name:Kit Test Camera"
      - name: Remove the service if a step stopped early
        if: always()
        shell: pwsh
        run: |
          $svc = Get-ChildItem camera-out/host -Recurse -Filter freerdp-shadow-service.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($svc -and (Get-Service FreeRDPShadow -ErrorAction SilentlyContinue)) { & $svc.FullName uninstall }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-host-camera-${{ matrix.runner }}
          path: |
            camera-out
            !camera-out/host
          retention-days: 7
          if-no-files-found: warn
