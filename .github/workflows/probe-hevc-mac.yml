# probe-hevc-mac: a record, not a kit test. Does FreeRDP's VideoToolbox HEVC 4:2:0 encoder
# (freerdp-comp-hevc-g1, fork branch feature-hevc-mac, 2026-11-25, on the RM's go) build and
# pass its codec tests on the macOS runner the kit's mac-host-test uses, and which VideoToolbox
# encoders does that runner have? Publishes nothing; the artifact carries the logs.
#   A: the Mac host's shape: WITH_GFX_AZURE=ON, VideoToolbox, no FFmpeg; the shadow server built too
#      (its Mac subsystem). The HEVC test can only check the encoded stream here (no decoder).
#   B: the same + Homebrew's FFmpeg as the decoder: VideoToolbox encodes, FFmpeg decodes, the test
#      compares the colours.
name: probe-hevc-mac

on:
  push:
    branches: [probe-hevc-mac]

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      FREERDP_REPO: https://github.com/congzhangzh/FreeRDP.git
      FREERDP_SHA: 392aec4c83e84ee944ee73f5061d1f3320ecbec5
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      OUT: ${{ github.workspace }}/probe-out
    steps:
      - uses: actions/checkout@v7

      - name: FreeRDP at the probed commit
        run: |
          mkdir -p "$OUT"
          git init -q freerdp && cd freerdp
          git fetch -q --depth 1 "$FREERDP_REPO" "$FREERDP_SHA" && git checkout -q FETCH_HEAD
          git log -1 --format='%H %s' | tee "$OUT/SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$FREERDP_SHA"

      - name: Tools
        run: |
          for t in ninja ffmpeg; do command -v $t || brew install --quiet $t; done
          brew list openssl@3 > /dev/null 2>&1 || brew install --quiet openssl@3
          sw_vers | tee "$OUT/sw_vers.txt"; sysctl -n machdep.cpu.brand_string | tee -a "$OUT/sw_vers.txt"

      - name: VideoToolbox encoders of this runner
        run: |
          clang -O1 probe/vt-encoders.c -o vt-encoders -framework VideoToolbox -framework CoreFoundation
          ./vt-encoders | tee "$OUT/vt-encoders.txt"

      - name: "A: Mac host shape (GFX_AZURE, VideoToolbox, no FFmpeg) + shadow"
        run: |
          set -o pipefail
          cmake -G Ninja -S freerdp -B build-a -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            -DWITH_GFX_AZURE=ON -DWITH_APPLE_VIDEOTOOLBOX=ON -DWITH_FFMPEG=OFF -DWITH_SWSCALE=OFF \
            -DWITH_CLIENT=OFF -DWITH_SERVER=ON -DWITH_SHADOW=ON -DWITH_PROXY=OFF -DWITH_SAMPLE=OFF \
            -DWITH_PLATFORM_SERVER=OFF -DWITH_OPENH264=OFF -DWITH_GFX_AV1=OFF -DWITH_GFX_AV2=OFF \
            -DWITH_X11=OFF -DWITH_WAYLAND=OFF -DWITH_PCSC=OFF -DWITH_KRB5=OFF -DWITH_FUSE=OFF \
            -DWITH_CUPS=OFF -DWITH_UNICODE_BUILTIN=ON -DWITH_JSON_DISABLED=ON -DCHANNEL_URBDRC=OFF \
            -DWITH_OPUS=OFF -DWITH_MANPAGES=OFF -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" 2>&1 | tee "$OUT/a-configure.log"
          # -k 0: every compile error, not just the first; a failed build fails the step
          cmake --build build-a -- -k 0 > "$OUT/a-build.log" 2>&1 || { grep -E -A3 'error:|FAILED' "$OUT/a-build.log" | head -80; exit 1; }
          grep -E 'warning:' "$OUT/a-build.log" | grep -E 'videotoolbox|hevc|shadow' || true
          cd build-a && WLOG_LEVEL=DEBUG \
            ctest -R 'TestFreeRDPCodec(HEVC|H264)' -V 2>&1 | tee "$OUT/a-ctest.log" | tail -40

      - name: "B: + FFmpeg decoder (VideoToolbox encodes, FFmpeg decodes)"
        run: |
          set -o pipefail
          cmake -G Ninja -S freerdp -B build-b -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            -DWITH_GFX_AZURE=ON -DWITH_APPLE_VIDEOTOOLBOX=ON -DWITH_FFMPEG=ON -DWITH_VIDEO_FFMPEG=ON \
            -DWITH_DSP_FFMPEG=OFF -DWITH_SWSCALE=ON \
            -DWITH_CLIENT=OFF -DWITH_SERVER=OFF -DWITH_SAMPLE=OFF -DWITH_OPENH264=OFF \
            -DWITH_GFX_AV1=OFF -DWITH_GFX_AV2=OFF -DWITH_X11=OFF -DWITH_WAYLAND=OFF -DWITH_PCSC=OFF \
            -DWITH_KRB5=OFF -DWITH_FUSE=OFF -DWITH_CUPS=OFF -DWITH_UNICODE_BUILTIN=ON \
            -DWITH_JSON_DISABLED=ON -DCHANNEL_URBDRC=OFF -DWITH_OPUS=OFF -DWITH_MANPAGES=OFF \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" 2>&1 | tee "$OUT/b-configure.log"
          cmake --build build-b --target TestFreeRDPCodec -- -k 0 > "$OUT/b-build.log" 2>&1 || { grep -E -A3 'error:|FAILED' "$OUT/b-build.log" | head -80; exit 1; }
          cd build-b && WLOG_LEVEL=DEBUG \
            ctest -R 'TestFreeRDPCodec(HEVC|H264)' -V 2>&1 | tee "$OUT/b-ctest.log" | tail -40

      - name: Which encoder ran
        if: always()
        run: grep -h -E 'VideoToolbox (HEVC|H\.264) encoder|HEVC 4:|no encoder|no decoder|tests passed' "$OUT"/*-ctest.log || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-hevc-mac
          path: probe-out
          retention-days: 14
