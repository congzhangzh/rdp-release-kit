# Probe (branch probe-mac-hevc-first only; publishes nothing, no secrets, uploads logs): the macOS
# host takes HEVC first. FreeRDP-Shadow.app built as the release builds it (HOST=1 ./build-macos.sh
# arm64) from the freerdp_mac_host pin of this branch's sources.lock (fork
# feature-shadow-mac-hevc-first d9839ae7b: the default codec order on macOS is HEVC, AV2, AV1, ...),
# the kit's macOS client as the release builds it (./build-macos.sh arm64, the freerdp pin), then
# test/mac-hevc-first.sh: a server with AV1, AV2 and HEVC on; a client offering FRDP_1 + 11.x and
# one offering FRDP_2, FRDP_1 + 11.x must both be confirmed 11.x and get HEVC 4:2:0 frames. The job
# fails on any FAIL line (unlike kit.yml's mac-host-test, it is not continue-on-error).
name: probe-mac-hevc-first

on:
  push:
    branches: [probe-mac-hevc-first]

permissions:
  contents: read

env:
  FREERDP_REPO: https://github.com/congzhangzh/FreeRDP.git
  FREERDP_BRANCH: feature-shadow-mac-hevc-first

jobs:
  mac-client:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Cache sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/sources
          key: sources-${{ hashFiles('sources.lock') }}
      - name: Cache compiled objects
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/ccache/macos
          key: ccache-macos-arm64-machevc-${{ github.sha }}
          restore-keys: ccache-macos-arm64-
      - name: Build tools
        run: brew install bash meson nasm ccache
      - name: Build (as the release)
        env:
          CCACHE_MAXSIZE: 1G
        run: ./build-macos.sh arm64
      - uses: actions/upload-artifact@v7
        with:
          name: probe-client-macos-arm64
          path: dist/*.tar.xz
          if-no-files-found: error
          retention-days: 3

  mac-host:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: FreeRDP for the host, the probed commit
        run: |
          mkdir -p logs
          grep -E '^freerdp_mac_host ' sources.lock | tee logs/freerdp-host.txt
          pin=$(awk '/^freerdp_mac_host /{ print $NF }' sources.lock)
          git ls-remote "$FREERDP_REPO" "refs/heads/$FREERDP_BRANCH" | tee logs/branch-head.txt
          # the pin is the branch's head: the probe tests what the branch holds
          grep -q "^$pin" logs/branch-head.txt
      - name: Cache sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/sources
          key: sources-${{ hashFiles('sources.lock') }}
      - name: Cache compiled objects
        uses: actions/cache@v6
        with:
          path: ~/.cache/rdp-release-kit/ccache/macos
          key: ccache-macos-host-arm64-machevc-${{ github.sha }}
          restore-keys: |
            ccache-macos-host-arm64-
            ccache-macos-arm64-
      - name: Build tools
        run: brew install bash meson nasm ccache
      - name: Build (as the release)
        env:
          CCACHE_MAXSIZE: 1G
          HOST: "1"
        run: ./build-macos.sh arm64 2>&1 | tee logs/build.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-host-log-macos-arm64
          path: |
            logs
            ~/.cache/rdp-release-kit/macos-arm64/log
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: probe-host-macos-arm64
          path: dist/freerdp-host-*.zip
          if-no-files-found: error
          retention-days: 3

  hevc-first:
    needs: [mac-client, mac-host]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: probe-host-macos-arm64
          path: dl/host
      - uses: actions/download-artifact@v8
        with:
          name: probe-client-macos-arm64
          path: dl/client
      - name: Unpack
        run: |
          cd dl/host && ditto -x -k freerdp-host-*.zip . && cd ../client && tar -xf sdl3-freerdp-*.tar.xz
          cd .. && xattr -dr com.apple.quarantine . || true
          ls -d host/*/ client/*/
      - name: HEVC first (test/mac-hevc-first.sh)
        run: |
          # the script's own exit, not tee's
          set -o pipefail
          rc=0
          test/mac-hevc-first.sh "$(ls -d dl/host/freerdp-host-*-macos-arm64)" \
              "$(ls -d dl/client/sdl3-freerdp-*-macos-arm64)" out | tee out-hevc-first.txt || rc=$?
          mkdir -p out && mv out-hevc-first.txt out/
          grep -E '^(PASS|FAIL) ' out/out-hevc-first.txt >> "$GITHUB_STEP_SUMMARY" || true
          # any FAIL, no PASS at all, or the script's own failure fails the job
          if grep -q '^FAIL ' out/out-hevc-first.txt || ! grep -q '^PASS ' out/out-hevc-first.txt || [ $rc != 0 ]; then
              echo "::error::HEVC first failed (rc $rc)"; exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-mac-hevc-first
          path: out
          retention-days: 7
